<script>

let sesionActiva=false;
let usuarioActual=null;
let expedienteActual=null;
let ultimoCalculo=null;


/* =====================================================
   UTILIDADES
===================================================== */

function tokenActual(){

    return localStorage.getItem(
        "gestorIA_token"
    );
}


function formatoEuro(valor){

    const numero=
        Number(valor || 0);

    return numero.toLocaleString(
        "es-ES",
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    ) + " €";
}


function nombreUsuario(){

    if(!usuarioActual){
        return "";
    }

    if(typeof usuarioActual==="string"){
        return usuarioActual;
    }

    return (
        usuarioActual.email ||
        usuarioActual.nombre ||
        "Usuario"
    );
}


function requiereSesion(){

    if(
        !sesionActiva ||
        !tokenActual()
    ){

        login();

        return false;
    }

    return true;
}


/* =====================================================
   SESIÓN
===================================================== */

async function restaurarSesion(){

    const token=
        tokenActual();

    if(!token){

        inicio();

        return;
    }

    try{

        const res=
            await fetch(
                "/api/sesion",
                {
                    headers:{
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );

        const data=
            await res.json();

        if(!res.ok || !data.ok){

            localStorage.removeItem(
                "gestorIA_token"
            );

            localStorage.removeItem(
                "gestorIA_refresh_token"
            );

            inicio();

            return;
        }

        sesionActiva=true;

        usuarioActual=
            data.usuario;

        actualizarUsuario();

        inicio();

    }catch(error){

        inicio();
    }
}

   INICIO
===================================================== */

===================================================== */

/* =====================================================
   LOGIN
===================================================== */

function login(){

    modalContenido.innerHTML=`

    <h2>
        Iniciar sesión
    </h2>

    <input
        id="loginEmail"
        placeholder="Correo">

    <input
        id="loginPass"
        type="password"
        placeholder="Contraseña">

    <br><br>

    <button onclick="entrar()">
        Entrar
    </button>

    <button
        class="btn-secundario"
        onclick="registro()">
        Crear cuenta
    </button>

    `;

    modal.style.display="flex";
}


async function entrar(){

    const email=
        document
        .getElementById(
            "loginEmail"
        ).value;

    const password=
        document
        .getElementById(
            "loginPass"
        ).value;

    try{

        const res=
            await fetch(
                "/api/login",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({
                        email,
                        password
                    })
                }
            );

        const data=
            await res.json();

        if(!data.ok){

            alert(
                data.error ||
                "Login incorrecto."
            );

            return;
        }

        sesionActiva=true;

        usuarioActual=
            data.usuario ||
            email;

        localStorage.setItem(
            "gestorIA_token",
            data.access_token
        );

        if(data.refresh_token){

            localStorage.setItem(
                "gestorIA_refresh_token",
                data.refresh_token
            );
        }

        modal.style.display="none";

        actualizarUsuario();

        inicio();

    }catch(error){

        alert(
            "No se pudo iniciar sesión."
        );
    }
}


/* =====================================================
   REGISTRO
===================================================== */

function registro(){

    modalContenido.innerHTML=`

    <h2>
        Crear cuenta

    <input
        id="regNombre"
        placeholder="Nombre">

    <input
        id="regEmail"

        id="regPass"
        type="password"

}


async function crearCuenta(){

    const nombre=
        document
        .getElementById(
            "regNombre"
        ).value;

    const email=
        document
        .getElementById(
            "regEmail"
        ).value;

    const password=
        document
        .getElementById(
            "regPass"
        ).value;

    try{

        const res=
            await fetch(
                "/api/registro",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({
                        nombre,
                        email,
                        password
                    })
                }
            );

        const data=
            await res.json();

        if(data.ok){

            modalContenido.innerHTML=`

            <h2>
                ✉️ Revisa tu correo
            </h2>

            <p>
                Te hemos enviado un enlace
                para verificar tu cuenta.
            </p>

            <button onclick="login()">
                Iniciar sesión
            </button>

            `;

        }else{

            alert(
                data.error ||
                "No se pudo crear la cuenta."
            );
        }

    }catch(error){

        alert(
            "No se pudo crear la cuenta."
        );
    }
}


/* =====================================================
   USUARIO
===================================================== */

function actualizarUsuario(){

    usuario.innerHTML=`

    <span>
        👤 ${nombreUsuario()}
    </span>

    <button
        class="btn-secundario"
        onclick="cerrarSesion()">
        Salir
    </button>

    `;
}


function cerrarSesion(){

    localStorage.removeItem(
        "gestorIA_token"
    );

    localStorage.removeItem(
        "gestorIA_refresh_token"
    );

    sesionActiva=false;
    usuarioActual=null;
    expedienteActual=null;
    ultimoCalculo=null;

    location.reload();
}


/* =====================================================
   NUEVO TRASPASO
===================================================== */

function nuevoTraspaso(){

    if(!requiereSesion()) return;

    contenido.innerHTML=`

    <div class="card">

        <h1>
            🚗 Iniciar traspaso
        </h1>

        <p>
            Introduce la matrícula.
            El expediente se guardará
            desde este momento.
        </p>

        <input
            id="matriculaTraspaso"
            placeholder="1234ABC">

        <br><br>

        <button onclick="crearExpediente()">
            Continuar
        </button>

    </div>

    `;
}


async function crearExpediente(){

    const matricula=
        document
        .getElementById(
            "matriculaTraspaso"
        )
        .value
        .trim()
        .toUpperCase();

    if(!matricula){

        alert(
            "Introduce la matrícula."
        );

        return;
    }

    try{

        const res=
            await fetch(
                "/api/expediente?action=crear",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " +
                            tokenActual()
                    },

                    body:JSON.stringify({
                        matricula
                    })
                }
            );

        const data=
            await res.json();

        if(!data.ok){

            alert(
                data.error ||
                "No se pudo crear el expediente."
            );

            return;
        }

        expedienteActual=
            data.expediente;

        if(data.existente){

            const seguir=
                confirm(
                    "Ya tienes un expediente activo para esta matrícula. ¿Quieres continuarlo?"
                );

            if(seguir){

                continuarExpediente(
                    expedienteActual
                );

            }else{

                misExpedientes();
            }

            return;
        }

        formularioParticipante();

    }catch(error){

        alert(
            "No se pudo crear el expediente."
        );
    }
}


/* =====================================================
   PARTICIPANTE
===================================================== */

function formularioParticipante(){

    contenido.innerHTML=`

    <div class="card">

        <h1>
            Tus datos
        </h1>

        <p>
            Vehículo:
            <b>
                ${expedienteActual.matricula}
            </b>
        </p>

        <div class="campo">

            <label>
                Nombre y apellidos
            </label>

            <input
                id="participanteNombre"
                placeholder="Nombre completo">

        </div>

        <div class="campo">

            <label>
                DNI / NIE
            </label>

            <input
                id="participanteDni"
                placeholder="DNI o NIE">

        </div>

        <div class="campo">

            <label>
                Teléfono
            </label>

            <input
                id="participanteTelefono"
                placeholder="Teléfono">

        </div>

        <div class="campo">

            <label>
                Correo
            </label>

            <input
                id="participanteEmail"
                type="email"
                placeholder="Correo electrónico">

        </div>

        <div class="campo">

            <label>
                En este traspaso eres:
            </label>

            <select
                id="participanteRol">

                <option value="">
                    Selecciona
                </option>

                <option value="COMPRADOR">
                    Comprador
                </option>

                <option value="VENDEDOR">
                    Vendedor
                </option>

            </select>

        </div>

        <br>

        <button
            onclick="guardarParticipante()">
            Continuar
        </button>

    </div>

    `;
}


async function guardarParticipante(){

    const nombre=
        document
        .getElementById(
            "participanteNombre"
        ).value.trim();

    const dni_nie=
        document
        .getElementById(
            "participanteDni"
        ).value.trim();

    const telefono=
        document
        .getElementById(
            "participanteTelefono"
        ).value.trim();

    const email=
        document
        .getElementById(
            "participanteEmail"
        ).value.trim();

    const rol=
        document
        .getElementById(
            "participanteRol"
        ).value;

    if(
        !nombre ||
        !dni_nie ||
        !telefono ||
        !email ||
        !rol
    ){

        alert(
            "Completa todos los campos."
        );

        return;
    }

    try{

        const res=
            await fetch(
                "/api/guardar-participante",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " +
                            tokenActual()
                    },

                    body:JSON.stringify({

                        expediente_id:
                            expedienteActual.id,

                        nombre,
                        dni_nie,
                        telefono,
                        email,
                        rol

                    })
                }
            );

        const data=
            await res.json();

        if(!data.ok){

            alert(
                data.error ||
                "No se pudieron guardar los datos."
            );

            return;
        }

        expedienteActual.estado=
            "DATOS_INICIALES";

        abrirChat();

    }catch(error){

        alert(
            "No se pudieron guardar los datos."
        );
    }
}


/* =====================================================
   CHAT
===================================================== */

async function abrirChat(){

    contenido.innerHTML=`

    <div class="card">

        <h1>
            🚗 ${expedienteActual.matricula}
        </h1>

        <div class="estado">
            🤖 Gestor-IA está gestionando
            este expediente.
        </div>

        <div id="chat"></div>

        <div class="fila-chat">

            <input
                id="mensaje"
                placeholder="Escribe tu respuesta...">

            <button
                onclick="enviarMensaje()">
                Enviar
            </button>

        </div>

    </div>

    `;

    document
    .getElementById("mensaje")
    .addEventListener(
        "keydown",
        function(e){

            if(e.key==="Enter"){

                enviarMensaje();
            }
        }
    );

    await iniciarConversacion();
}


async function iniciarConversacion(){

    try{

        const res=
            await fetch(
                "/api/chat",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " +
                            tokenActual()
                    },

                    body:JSON.stringify({

                        expediente_id:
                            expedienteActual.id,

                        mensaje:""

                    })
                }
            );

        const data=
            await res.json();

        if(!res.ok){

            agregarMensaje(
                "bot",
                data.error ||
                "No se pudo iniciar la conversación."
            );

            return;
        }

        agregarMensaje(
            "bot",
            data.respuesta
        );


        if(
            data.requiere_factura === true
        ){

            setTimeout(
                pantallaFacturaPendiente,
                900
            );

            return;
        }


        if(
            data.solicitar_calculo === true
        ){

            setTimeout(
                calcularCosteFiscal,
                800
            );

            return;
        }


        if(
            data.paso_actual ===
            "PAGO_PENDIENTE"
        ){

            setTimeout(
                cargarCalculoGuardado,
                700
            );
        }

    }catch(error){

        agregarMensaje(
            "bot",
            "No se pudo iniciar Gestor-IA."
        );
    }
}


function agregarMensaje(
    tipo,
    texto
){

    const chat=
        document.getElementById(
            "chat"
        );

    if(!chat) return;

    const div=
        document.createElement(
            "div"
        );

    div.className=tipo;

    const span=
        document.createElement(
            "span"
        );

    span.textContent=
        texto || "";

    div.appendChild(span);

    chat.appendChild(div);

    chat.scrollTop=
        chat.scrollHeight;
}


async function enviarMensaje(){

    const input=
        document.getElementById(
            "mensaje"
        );

    if(!input) return;

    const mensaje=
        input.value.trim();

    if(!mensaje) return;

    agregarMensaje(
        "user",
        mensaje
    );

    input.value="";

    agregarMensaje(
        "bot",
        "Pensando..."
    );

    try{

        const res=
            await fetch(
                "/api/chat",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " +
                            tokenActual()
                    },

                    body:JSON.stringify({

                        expediente_id:
                            expedienteActual.id,

                        mensaje

                    })
                }
            );

        const data=
            await res.json();

        const chat=
            document.getElementById(
                "chat"
            );

        if(
            chat?.lastChild
        ){

            chat.removeChild(
                chat.lastChild
            );
        }

        if(!res.ok){

            agregarMensaje(
                "bot",
                data.error ||
                "No se pudo responder."
            );

            return;
        }

        agregarMensaje(
            "bot",
            data.respuesta
        );


        if(
            data.vehiculo
        ){

            expedienteActual
                .modelo_fiscal_identificado=
                data.vehiculo.modelo_tipo ||
                data.vehiculo.modelo ||
                null;
        }


        if(
            data.requiere_factura === true
        ){

            setTimeout(
                pantallaFacturaPendiente,
                1000
            );

            return;
        }


        if(
            data.solicitar_calculo === true
        ){

            setTimeout(
                calcularCosteFiscal,
                900
            );

            return;
        }


        if(
            data.paso_actual ===
            "PAGO_PENDIENTE"
        ){

            setTimeout(
                cargarCalculoGuardado,
                800
            );
        }

    }catch(error){

        const chat=
            document.getElementById(
                "chat"
            );

        if(
            chat?.lastChild
        ){

            chat.removeChild(
                chat.lastChild
            );
        }

        agregarMensaje(
            "bot",
            "Error de conexión."
        );
    }
}


/* =====================================================
   CÁLCULO FISCAL
===================================================== */

async function calcularCosteFiscal(){

    contenido.innerHTML=`

    <div class="card calculando">

        <h2>
            🤖 Calculando el traspaso...
        </h2>

        <p>
            Gestor-IA está comprobando
            la valoración fiscal, el impuesto,
            la tasa DGT y el servicio.
        </p>

    </div>

    `;


    try{

        const res=
            await fetch(
                "/api/expediente?action=calcular-coste",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " +
                            tokenActual()
                    },

                    body:JSON.stringify({

                        expediente_id:
                            expedienteActual.id

                    })
                }
            );


        const data=
            await res.json();


        if(
            !res.ok ||
            !data.ok
        ){

            pantallaCalculoBloqueado(
                data
            );

            return;
        }


        if(
            data.pago_bloqueado === true ||
            data.calculo_verificado !== true
        ){

            pantallaCalculoBloqueado(
                data
            );

            return;
        }


        ultimoCalculo=
            data;


        expedienteActual.estado=
            "PAGO_PENDIENTE";

        expedienteActual
            .calculo_fiscal_verificado=
            true;

        pantallaPagoExacto(
            data
        );


    }catch(error){

        contenido.innerHTML=`

        <div class="card">

            <h1>
                ⚠️ No se pudo calcular
            </h1>

            <div class="bloqueo-box">

                <p>
                    Se produjo un error de conexión
                    al calcular el expediente.
                </p>

            </div>

            <button
                onclick="calcularCosteFiscal()">

                Reintentar

            </button>

        </div>

        `;
    }
}


/* =====================================================
   CÁLCULO BLOQUEADO

function pantallaCalculoBloqueado(data){

        data?.error ||

    let extra="";


    if(
        data?.requiere_documentacion
    ){

        extra=`

        <p>
            📄 Este caso requiere documentación
            antes de poder determinar el importe.
        </p>

        `;
    }


    if(
        data?.territorio
    ){

        extra+=`

        <p>
            Territorio fiscal:
            <b>${data.territorio}</b>
        </p>

        `;
    }


    contenido.innerHTML=`

    <div class="card">

        <h1>
            🔒 Cálculo pendiente de verificación
        </h1>

        <div class="bloqueo-box">

            <p>
                ${motivo}
            </p>

            ${extra}

        </div>

        <p>
            Gestor-IA no habilitará el pago
            hasta disponer de un cálculo fiscal
            verificado.
        </p>

        <button
            class="btn-secundario"

        </button>

    `;
}

            </p>

                    vehiculo.valor_oficial

                Valor fiscal:
                ${formatoEuro(
                    vehiculo.valor_fiscal
                )}

        </div>


        <div class="pago-box">

            <div class="linea-pago">

                <span>
                    Impuestos aplicables
                </span>

                <span>
                    ${formatoEuro(impuesto)}
                </span>

            </div>


            <div class="linea-pago">

                <span>
                    Tasa DGT
                </span>

                <span>
                    ${formatoEuro(dgt)}
                </span>

            </div>


            <div class="linea-pago">

                <span>
                    Servicio Gestor-IA
                </span>

                <span>
                    ${formatoEuro(servicio)}
                </span>

            </div>


            <div class="linea-pago total">

                <span>
                    TOTAL A PAGAR
                </span>

                <span>
                    ${formatoEuro(total)}
                </span>

            </div>

        </div>


        <div class="valor-fiscal">

            Territorio fiscal:
            <b>
                ${fiscal.territorio || "-"}
            </b>

            <br>

/* =====================================================

===================================================== */

async function cargarCalculoGuardado(){

    /*
       Recalculamos desde backend para no confiar
       en importes almacenados en el navegador.
    */

    await calcularCosteFiscal();
}


/* =====================================================
   SIMULAR PAGO
===================================================== */

async function simularPago(){

    const total=
        ultimoCalculo
            ?.costes
            ?.total;


    const texto=
        total
            ?
            `¿Simular el pago de ${formatoEuro(total)}?`
            :
            "¿Simular el pago de este expediente?";


    if(
        !confirm(texto)
    ){
        return;
    }


    try{

        const res=
            await fetch(
                "/api/expediente?action=simular-pago",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " +
                            tokenActual()
                    },

                    body:JSON.stringify({

                        expediente_id:
                            expedienteActual.id

                    })
                }
            );


        const data=
            await res.json();


        if(
            !res.ok ||
            !data.ok
        ){

            alert(
                data.error ||
                "No se pudo simular el pago."
            );

            return;
        }


        expedienteActual=
            data.expediente;


        pantallaPostPago();


    }catch(error){

        alert(
            "No se pudo simular el pago."
        );
    }
}

/* =====================================================
   MIS EXPEDIENTES
===================================================== */

async function misExpedientes(){

    if(!requiereSesion()) return;


    contenido.innerHTML=`

    <div class="card">

        <h1>
            📁 Mis expedientes
        </h1>

        <p>
            Cargando expedientes...
        </p>

    </div>

    `;


    try{

        const res=
            await fetch(
                "/api/expediente?action=listar",
                {
                    method:"GET",

                    headers:{
                        "Authorization":
                            "Bearer " +
                            tokenActual()
                    }
                }
            );


        const data=
            await res.json();


        if(
            !res.ok ||
            !data.ok
        ){

            contenido.innerHTML=`

            <div class="card">

                <h1>
                    📁 Mis expedientes
                </h1>

                <p>
                    ${data.error ||
                    "No se pudieron cargar."}
                </p>

            </div>

            `;

            return;
        }


        if(
            !data.expedientes.length
        ){

            contenido.innerHTML=`

            <div class="card">

                <h1>
                    📁 Mis expedientes
                </h1>

                <p>
                    Todavía no tienes
                    ningún expediente.
                </p>

                <button
                    onclick="nuevoTraspaso()">

                    Iniciar traspaso

                </button>

            </div>

            `;

            return;
        }


        let tarjetas="";


        data.expedientes.forEach(
            function(exp,index){

                tarjetas+=`

                <div class="expediente-card">

                    <div class="expediente-top">

                        <div>

                            <div class="expediente-matricula">
                                🚗 ${exp.matricula}
                            </div>

                            <br>

                            <span class="estado-pill">
                                ${textoEstado(exp.estado)}
                            </span>

                        </div>

                        <button
                            onclick="continuarExpedientePorIndice(${index})">

                            ${
                                exp.estado ===
                                "FINALIZADO"
                                ?
                                "Ver expediente"
                                :
                                "Continuar"
                            }

                        </button>

                    </div>

                </div>

                `;
            }
        );


        window.expedientesCargados=
            data.expedientes;


        contenido.innerHTML=`

        <div class="card">

            <h1>
                📁 Mis expedientes
            </h1>

            <div class="expedientes-grid">

                ${tarjetas}

            </div>

        </div>

        `;


    }catch(error){

        contenido.innerHTML=`

        <div class="card">

            <h1>
                📁 Mis expedientes
            </h1>

            <p>
                No se pudieron cargar.
            </p>

        </div>

        `;
    }
}


function continuarExpedientePorIndice(index){

    const exp=
        window.expedientesCargados?.[index];

    if(!exp) return;

    continuarExpediente(exp);
}


function textoEstado(estado){

    const nombres={

        CREADO:
            "Datos pendientes",

        DATOS_INICIALES:
            "Recogiendo datos",

        IDENTIFICANDO_VEHICULO:
            "Identificando vehículo",

        DATOS_FISCALES:
            "Comprobación fiscal",

        CALCULO_FISCAL:
            "Calculando impuestos",

        FACTURA_PENDIENTE:
            "Factura pendiente",

        PAGO_PENDIENTE:
            "Pendiente de pago",

        PAGO_VALIDADO:
            "Pago confirmado",

        INVITACION_GENERADA:
            "Esperando participante",

        FINALIZADO:
            "Finalizado ✅"

    };


    return nombres[estado] ||
        estado;
}


/* =====================================================
   CONTINUAR EXPEDIENTE
===================================================== */

function continuarExpediente(exp){

    expedienteActual=exp;

    ultimoCalculo=null;


    switch(exp.estado){


        case "CREADO":

            formularioParticipante();

            break;


        case "DATOS_INICIALES":

        case "IDENTIFICANDO_VEHICULO":

        case "DATOS_FISCALES":

            abrirChat();

            break;


        case "CALCULO_FISCAL":

            calcularCosteFiscal();

            break;


        case "FACTURA_PENDIENTE":

            pantallaFacturaPendiente();

            break;


        case "PAGO_PENDIENTE":

            cargarCalculoGuardado();

            break;


        case "PAGO_VALIDADO":

            pantallaPostPago();

            break;


        case "INVITACION_GENERADA":

            pantallaPostPago();

            break;


        case "FINALIZADO":

            contenido.innerHTML=`

            <div class="card">

                <h1>
                    ✅ Traspaso finalizado
                </h1>

                <p>
                    Matrícula:
                    <b>
                        ${exp.matricula}
                    </b>
                </p>

                <div class="estado">

                    Este expediente consta
                    como finalizado.

                </div>

            </div>

            `;

            break;


        default:

            abrirChat();
    }
}
