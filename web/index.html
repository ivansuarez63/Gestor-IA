<script>

let sesionActiva=false;
let usuarioActual=null;
let expedienteActual=null;
let ultimoCalculo=null;


/* =====================================================
   TEXTO
===================================================== */

function limpiarTextoIA(texto){

    let s=
        String(
            texto ?? ""
        );

    const reemplazos={
        "Ã¡":"á",
        "Ã©":"é",
        "Ã­":"í",
        "Ã³":"ó",
        "Ãº":"ú",
        "Ã":"Á",
        "Ã‰":"É",
        "Ã":"Í",
        "Ã“":"Ó",
        "Ãš":"Ú",
        "Ã±":"ñ",
        "Ã‘":"Ñ",
        "Â¿":"¿",
        "Â¡":"¡",
        "Âº":"º",
        "Âª":"ª",
        "â‚¬":"€",
        "â€“":"–",
        "â€”":"—",
        "Â":""
    };

    for(
        const [mal,bien]
        of Object.entries(
            reemplazos
        )
    ){

        s=
            s
            .split(mal)
            .join(bien);
    }

    return s
        .replace(/\uFFFD/g,"")
        .replace(
            /[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/g,
            ""
        );
}


/* =====================================================
   UTILIDADES
===================================================== */

function tokenActual(){

    return localStorage.getItem(
        "gestorIA_token"
    );
}


function formatoEuro(valor){

    const numero=
        Number(
            valor || 0
        );

    return numero.toLocaleString(
        "es-ES",
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    ) + " €";
}


function nombreUsuario(){

    if(!usuarioActual){
        return "";
    }

    if(
        typeof usuarioActual ===
        "string"
    ){
        return limpiarTextoIA(
            usuarioActual
        );
    }

    return limpiarTextoIA(
        usuarioActual.email ||
        usuarioActual.nombre ||
        "Usuario"
    );
}


function requiereSesion(){

    if(
        !sesionActiva ||
        !tokenActual()
    ){

        login();

        return false;
    }

    return true;
}


/* =====================================================
   SESIÓN
===================================================== */

async function restaurarSesion(){

    const token=
        tokenActual();

    if(!token){

        inicio();

        return;
    }

    try{

        const res=
            await fetch(
                "/api/sesion",
                {
                    headers:{
                        "Authorization":
                            "Bearer " +
                            token
                    }
                }
            );

        const data=
            await res.json();

        if(
            !res.ok ||
            !data.ok
        ){

            localStorage.removeItem(
                "gestorIA_token"
            );

            localStorage.removeItem(
                "gestorIA_refresh_token"
            );

            inicio();

            return;
        }

        sesionActiva=true;

        usuarioActual=
            data.usuario;

        actualizarUsuario();

        inicio();

    }catch(error){

        inicio();
    }
}

/* =====================================================
   LOGIN
===================================================== */

function login(){

    modalContenido.innerHTML=`

    <h2>
        Iniciar sesión
    </h2>

    <input
        id="loginEmail"
        placeholder="Correo"
    >

    <input
        id="loginPass"
        type="password"
        placeholder="Contraseña"
    >

    <br><br>

    <button onclick="entrar()">
        Entrar
    </button>

    <button
        class="btn-secundario"
        onclick="registro()"
    >
        Crear cuenta
    </button>

    `;

    modal.style.display=
        "flex";
}


async function entrar(){

    const email=
        document
        .getElementById(
            "loginEmail"
        )
        .value;

    const password=
        document
        .getElementById(
            "loginPass"
        )
        .value;

    try{

        const res=
            await fetch(
                "/api/login",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json; charset=UTF-8"
                    },

                    body:
                        JSON.stringify({
                            email,
                            password
                        })
                }
            );

        const data=
            await res.json();

        if(!data.ok){

            alert(
                limpiarTextoIA(
                    data.error ||
                    "Login incorrecto."
                )
            );

            return;
        }

        sesionActiva=true;

        usuarioActual=
            data.usuario ||
            email;

        localStorage.setItem(
            "gestorIA_token",
            data.access_token
        );

        if(
            data.refresh_token
        ){

            localStorage.setItem(
                "gestorIA_refresh_token",
                data.refresh_token
            );
        }

        modal.style.display=
            "none";

        actualizarUsuario();

        inicio();

    }catch(error){

        alert(
            "No se pudo iniciar sesión."
        );
    }
}

function actualizarUsuario(){

function cerrarSesion(){

    localStorage.removeItem(
        "gestorIA_token"
    );

    localStorage.removeItem(
        "gestorIA_refresh_token"
    );

    sesionActiva=false;
    usuarioActual=null;
    expedienteActual=null;
    ultimoCalculo=null;

    location.reload();
}


/* =====================================================
   NUEVO TRASPASO
===================================================== */

function nuevoTraspaso(){

    if(
        !requiereSesion()
    ){
        return;
    }

    contenido.innerHTML=`

    <div class="card">

        <h1>
            🚗 Iniciar traspaso
        </h1>

        <p>
            Introduce la matrícula.
            El expediente se guardará
            desde este momento.
        </p>

        <input
            id="matriculaTraspaso"
            placeholder="1234ABC"
        >

        <br><br>

        <button onclick="crearExpediente()">
            Continuar
        </button>

    </div>

    `;
}


async function crearExpediente(){

    const matricula=
        document
        .getElementById(
            "matriculaTraspaso"
        )
        .value
        .trim()
        .toUpperCase();

    if(!matricula){

        alert(
            "Introduce la matrícula."
        );

        return;
    }

    try{

        const res=
            await fetch(
                "/api/expediente?action=crear",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json; charset=UTF-8",

                        "Authorization":
                            "Bearer " +
                            tokenActual()
                    },

                    body:
                        JSON.stringify({
                            matricula
                        })
                }
            );

        const data=
            await res.json();

        if(!data.ok){

            alert(
                limpiarTextoIA(
                    data.error ||
                    "No se pudo crear el expediente."
                )
            );

            return;
        }

        expedienteActual=
            data.expediente;

        if(data.existente){

            const seguir=
                confirm(
                    "Ya tienes un expediente activo para esta matrícula. ¿Quieres continuarlo?"
                );

            if(seguir){

                continuarExpediente(
                    expedienteActual
                );

            }else{

                misExpedientes();
            }

            return;
        }

        formularioParticipante();

    }catch(error){

        alert(
            "No se pudo crear el expediente."
        );
    }
}

function archivoABase64(
    archivo
){

    return new Promise(
        (
            resolve,
            reject
        )=>{

            const reader=
                new FileReader();

            reader.onload=()=>{

                const resultado=
                    String(
                        reader.result ||
                        ""
                    );

                const coma=
                    resultado.indexOf(
                        ","
                    );

                if(
                    coma === -1
                ){

                    reject(
                        new Error(
                            "No se pudo leer la imagen."
                        )
                    );

                    return;
                }

                resolve(
                    resultado.slice(
                        coma + 1
                    )
                );
            };

            reader.onerror=()=>{

                reject(
                    new Error(
                        "No se pudo leer la imagen."
                    )
                );
            };

            reader.readAsDataURL(
                archivo
            );
        }
    );
}

async function analizarFichaTecnica(){

    const input=
        document
        .getElementById(
            "archivoFicha"
        );

    const estado=
        document
        .getElementById(
            "estadoFicha"
        );

    const boton=
        document
        .getElementById(
            "botonAnalizarFicha"
        );

    const archivo=
        input?.files?.[0];

    if(!archivo){

        alert(
            "Selecciona una foto de la ficha técnica."
        );

        return;
    }

    const tiposPermitidos=[
        "image/jpeg",
        "image/png",
        "image/webp"
    ];

    if(
        !tiposPermitidos.includes(
            archivo.type
        )
    ){

        alert(
            "La ficha debe ser una imagen JPG, PNG o WEBP."
        );

        return;
    }

    if(
        archivo.size >
        8 * 1024 * 1024
    ){

        alert(
            "La imagen es demasiado grande. Usa una foto de menos de 8 MB."
        );

        return;
    }

    boton.disabled=
        true;

    estado.textContent=
        "🤖 Leyendo la ficha técnica...";

    try{

        const base64=
            await archivoABase64(
                archivo
            );

        const res=
            await fetch(
                "/api/analizar-ficha",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json; charset=UTF-8",

                        "Accept":
                            "application/json",

                        "Authorization":
                            "Bearer " +
                            tokenActual()
                    },

                    body:
                        JSON.stringify({

                            expediente_id:
                                expedienteActual.id,

                            imagen_base64:
                                base64,

                            mime_type:
                                archivo.type

                        })
                }
            );

        const data=
            await res.json();

        if(
            !res.ok ||
            !data.ok
        ){

            estado.textContent=
                limpiarTextoIA(
                    data.error ||
                    "No se pudo analizar la ficha técnica."
                );

            boton.disabled=
                false;

            return;
        }

        estado.textContent=
            limpiarTextoIA(
                data.mensaje
            );

        mostrarDatosExtraidos(
            data.datos_extraidos
        );

        expedienteActual.paso_actual=
            data.paso_actual;

        expedienteActual.estado=
            (
                data.paso_actual ===
                "CALCULO_FISCAL"
            )
                ?
                "CALCULO_FISCAL"
                :
                "DATOS_INICIALES";

        if(
            data.vehiculo
        ){

            expedienteActual.valoracion_id=
                data.vehiculo.id;

            expedienteActual
                .modelo_fiscal_identificado=
                data.vehiculo.modelo_tipo;
        }

        setTimeout(
            ()=>{

                abrirChat();

            },
            1500
        );

    }catch(error){

        console.error(
            error
        );

        estado.textContent=
            "No se pudo analizar la ficha técnica.";

        boton.disabled=
            false;
    }
}

async function iniciarConversacion(){

    try{

        const res=
            await fetch(
                "/api/chat",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json; charset=UTF-8",

                        "Accept":
                            "application/json",

                        "Authorization":
                            "Bearer " +
                            tokenActual()
                    },

                    body:
                        JSON.stringify({

                            expediente_id:
                                expedienteActual.id,

                            mensaje:""

                        })
                }
            );

        const data=
            await res.json();

        if(!res.ok){

            agregarMensaje(
                "bot",
                data.error ||
                "No se pudo iniciar la conversación."
            );

            return;
        }

        agregarMensaje(
            "bot",
            data.respuesta
        );

        if(
            data.requiere_factura ===
            true
        ){

            setTimeout(
                pantallaFacturaPendiente,
                900
            );

            return;
        }

        if(
            data.solicitar_calculo ===
            true
        ){

            setTimeout(
                calcularCosteFiscal,
                800
            );

            return;
        }

        if(
            data.paso_actual ===
            "PAGO_PENDIENTE"
        ){

            setTimeout(
                cargarCalculoGuardado,
                700
            );
        }

    }catch(error){

        agregarMensaje(
            "bot",
            "No se pudo iniciar Gestor-IA."
        );
    }
}


async function enviarMensaje(){

    const input=
        document
        .getElementById(
            "mensaje"
        );

    if(!input){
        return;
    }

    const mensaje=
        input.value
        .trim();

    if(!mensaje){
        return;
    }

    agregarMensaje(
        "user",
        mensaje
    );

    input.value="";

    agregarMensaje(
        "bot",
        "Pensando..."
    );

    try{

        const res=
            await fetch(
                "/api/chat",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json; charset=UTF-8",

                        "Accept":
                            "application/json",

                        "Authorization":
                            "Bearer " +
                            tokenActual()
                    },

                    body:
                        JSON.stringify({

                            expediente_id:
                                expedienteActual.id,

                            mensaje

                        })
                }
            );

        const data=
            await res.json();

        const chat=
            document
            .getElementById(
                "chat"
            );

        if(
            chat?.lastChild
        ){

            chat.removeChild(
                chat.lastChild
            );
        }

        if(!res.ok){

            agregarMensaje(
                "bot",
                data.error ||
                "No se pudo responder."
            );

            return;
        }

        agregarMensaje(
            "bot",
            data.respuesta
        );

        expedienteActual.paso_actual=
            data.paso_actual;

        if(
            data.vehiculo
        ){

            expedienteActual.valoracion_id=
                data.vehiculo.id;

            expedienteActual
                .modelo_fiscal_identificado=
                data.vehiculo.modelo_tipo ||
                data.vehiculo.modelo ||
                null;
        }

        if(
            data.requiere_factura ===
            true
        ){

            setTimeout(
                pantallaFacturaPendiente,
                1000
            );

            return;
        }

        if(
            data.solicitar_calculo ===
            true
        ){

            setTimeout(
                calcularCosteFiscal,
                900
            );

            return;
        }

        if(
            data.paso_actual ===
            "PAGO_PENDIENTE"
        ){

            setTimeout(
                cargarCalculoGuardado,
                800
            );
        }

    }catch(error){

        const chat=
            document
            .getElementById(
                "chat"
            );

        if(
            chat?.lastChild
        ){

            chat.removeChild(
                chat.lastChild
            );
        }

        agregarMensaje(
            "bot",
            "Error de conexión."
        );
    }
}

}

/* =====================================================
   INVITACIÓN
===================================================== */

async function generarInvitacion(){

    try{

        const res=
            await fetch(
                "/api/expediente?action=generar-invitacion",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json; charset=UTF-8",

                        "Authorization":
                            "Bearer " +
                            tokenActual()
                    },

                    body:
                        JSON.stringify({

                            expediente_id:
                                expedienteActual.id

                        })
                }
            );

        const data=
            await res.json();

        if(
            !res.ok ||
            !data.ok
        ){

            alert(
                limpiarTextoIA(
                    data.error ||
                    "No se pudo generar la invitación."
                )
            );

            return;
        }

        contenido.innerHTML=`

        <div class="card">

            <h1>
                🔗 Invitación creada
            </h1>

            <p>
                Envía este enlace a la
                otra persona del traspaso.
            </p>

            <div class="invitacion-box">

                <input
                    class="enlace-invitacion"
                    id="enlaceInvitacion"
                    readonly
                    value="${data.enlace}"
                >

                <br><br>

                <button
                    onclick="copiarInvitacion()"
                >
                    Copiar enlace
                </button>

            </div>

            <p>
                El enlace caduca en 48 horas
                y está asociado únicamente
                a este expediente.
            </p>

        </div>

        `;

    }catch(error){

        alert(
            "No se pudo generar la invitación."
        );
    }
}


function copiarInvitacion(){

    const input=
        document
        .getElementById(
            "enlaceInvitacion"
        );

    navigator.clipboard
        .writeText(
            input.value
        );

    alert(
        "Enlace copiado."
    );
}

/* =====================================================
   MIS EXPEDIENTES
===================================================== */

async function misExpedientes(){

    if(
        !requiereSesion()
    ){
        return;
    }

    contenido.innerHTML=`

    <div class="card">

        <h1>
            📁 Mis expedientes
        </h1>

        <p>
            Cargando expedientes...
        </p>

    </div>

    `;

    try{

        const res=
            await fetch(
                "/api/expediente?action=listar",
                {
                    method:"GET",

                    headers:{
                        "Authorization":
                            "Bearer " +
                            tokenActual()
                    }
                }
            );

        const data=
            await res.json();

        if(
            !res.ok ||
            !data.ok
        ){

            contenido.innerHTML=`

            <div class="card">

                <h1>
                    📁 Mis expedientes
                </h1>

                <p>
                    ${limpiarTextoIA(
                        data.error ||
                        "No se pudieron cargar."
                    )}
                </p>

            </div>

            `;

            return;
        }

        if(
            !data.expedientes.length
        ){

            contenido.innerHTML=`

            <div class="card">

                <h1>
                    📁 Mis expedientes
                </h1>

                <p>
                    Todavía no tienes
                    ningún expediente.
                </p>

                <button
                    onclick="nuevoTraspaso()"
                >
                    Iniciar traspaso
                </button>

            </div>

            `;

            return;
        }

        let tarjetas="";

        data.expedientes.forEach(
            function(
                exp,
                index
            ){

                tarjetas+=`

                <div class="expediente-card">

                    <div class="expediente-top">

                        <div>

                            <div class="expediente-matricula">

                                🚗
                                ${limpiarTextoIA(
                                    exp.matricula
                                )}

                            </div>

                            <br>

                            <span class="estado-pill">

                                ${limpiarTextoIA(
                                    textoEstado(
                                        exp.estado
                                    )
                                )}

                            </span>

                        </div>

                        <button
                            onclick="continuarExpedientePorIndice(${index})"
                        >

                            ${
                                exp.estado ===
                                "FINALIZADO"
                                    ?
                                    "Ver expediente"
                                    :
                                    "Continuar"
                            }

                        </button>

                    </div>

                </div>

                `;
            }
        );

        window.expedientesCargados=
            data.expedientes;

        contenido.innerHTML=`

        <div class="card">

            <h1>
                📁 Mis expedientes
            </h1>

            <div class="expedientes-grid">

                ${tarjetas}

            </div>

        </div>

        `;

    }catch(error){

        contenido.innerHTML=`

        <div class="card">

            <h1>
                📁 Mis expedientes
            </h1>

            <p>
                No se pudieron cargar.
            </p>

        </div>

        `;
    }
}


function continuarExpedientePorIndice(
    index
){

    const exp=
        window
        .expedientesCargados
        ?.[index];

    if(!exp){
        return;
    }

    continuarExpediente(
        exp
    );
}


function textoEstado(
    estado
){

    const nombres={

        CREADO:
            "Datos pendientes",

        FICHA_TECNICA:
            "Ficha técnica pendiente",

        DATOS_INICIALES:
            "Recogiendo datos",

        IDENTIFICANDO_VEHICULO:
            "Identificando vehículo",

        DATOS_FISCALES:
            "Comprobación fiscal",

        CALCULO_FISCAL:
            "Calculando impuestos",

        FACTURA_PENDIENTE:
            "Factura pendiente",

        PAGO_PENDIENTE:
            "Pendiente de pago",

        PAGO_VALIDADO:
            "Pago confirmado",

        INVITACION_GENERADA:
            "Esperando participante",

        FINALIZADO:
            "Finalizado ✅"

    };

    return nombres[estado] ||
        estado;
}


/* =====================================================
   CONTINUAR EXPEDIENTE
===================================================== */

function continuarExpediente(
    exp
){

    expedienteActual=
        exp;

    ultimoCalculo=
        null;

    switch(
        exp.estado
    ){

        case "CREADO":

            formularioParticipante();

            break;

        case "FICHA_TECNICA":

            pantallaFichaTecnica();

            break;

        case "DATOS_INICIALES":

        case "IDENTIFICANDO_VEHICULO":

        case "DATOS_FISCALES":

            abrirChat();

            break;

        case "CALCULO_FISCAL":

            calcularCosteFiscal();

            break;

        case "FACTURA_PENDIENTE":

            pantallaFacturaPendiente();

            break;

        case "PAGO_PENDIENTE":

            cargarCalculoGuardado();

            break;

        case "PAGO_VALIDADO":

            pantallaPostPago();

            break;

        case "INVITACION_GENERADA":

            pantallaPostPago();

            break;

        case "FINALIZADO":

            contenido.innerHTML=`

            <div class="card">

                <h1>
                    ✅ Traspaso finalizado
                </h1>

                <p>
                    Matrícula:

                    <b>
                        ${limpiarTextoIA(
                            exp.matricula
                        )}
                    </b>
                </p>

                <div class="estado">

                    Este expediente consta
                    como finalizado.

                </div>

            </div>

            `;

            break;

        default:

            abrirChat();
    }
}
