<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07111f">

<title>Gestor-IA | Traspasos de vehículos</title>

<style>
:root{
    --bg:#07111f;
    --bg2:#0b1728;
    --card:#0f1d30;
    --card2:#13243a;
    --line:rgba(255,255,255,.09);
    --text:#f8fafc;
    --muted:#9fb0c5;
    --primary:#2f8cff;
    --primary2:#58a6ff;
    --success:#32d583;
    --warning:#fdb022;
    --danger:#f97066;
    --shadow:0 24px 70px rgba(0,0,0,.28);
    --radius:22px;
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    background:
        radial-gradient(circle at 20% 0%,rgba(47,140,255,.13),transparent 35%),
        var(--bg);
    color:var(--text);
}

button,
input,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

a{
    color:inherit;
    text-decoration:none;
}

/* =====================================================
   HEADER
===================================================== */

.header{
    position:sticky;
    top:0;
    z-index:100;
    height:76px;
    border-bottom:1px solid var(--line);
    background:rgba(7,17,31,.88);
    backdrop-filter:blur(18px);
}

.header-inner{
    width:min(1180px,calc(100% - 40px));
    height:100%;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
    cursor:pointer;
}

.brand-icon{
    width:39px;
    height:39px;
    border-radius:11px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,var(--primary),#68b4ff);
    box-shadow:0 10px 30px rgba(47,140,255,.28);
    font-weight:900;
    font-size:17px;
}

.brand-name{
    font-size:21px;
    font-weight:800;
    letter-spacing:-.4px;
}

.brand-name span{
    color:var(--primary2);
}

.desktop-nav{
    display:flex;
    align-items:center;
    gap:28px;
}

.nav-link{
    color:#c4d0df;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition:.2s;
}

.nav-link:hover{
    color:white;
}

.header-actions{
    display:flex;
    align-items:center;
    gap:10px;
}

.btn{
    border:none;
    border-radius:11px;
    padding:12px 18px;
    font-weight:700;
    transition:.2s;
}

.btn:hover{
    transform:translateY(-1px);
}

.btn-primary{
    color:white;
    background:linear-gradient(135deg,var(--primary),#1875e8);
    box-shadow:0 8px 24px rgba(47,140,255,.22);
}

.btn-secondary{
    color:#dbe7f5;
    background:rgba(255,255,255,.055);
    border:1px solid var(--line);
}

.btn-light{
    color:#081321;
    background:white;
}

.menu-mobile{
    display:none;
    width:43px;
    height:43px;
    border:1px solid var(--line);
    border-radius:11px;
    color:white;
    background:rgba(255,255,255,.05);
    font-size:22px;
}

.mobile-panel{
    display:none;
}

/* =====================================================
   GENERAL
===================================================== */

.page{
    min-height:calc(100vh - 76px);
}

.container{
    width:min(1180px,calc(100% - 40px));
    margin:auto;
}

.section{
    padding:90px 0;
}

.section-small{
    padding:65px 0;
}

.eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:7px 11px;
    border:1px solid rgba(88,166,255,.22);
    background:rgba(47,140,255,.08);
    border-radius:100px;
    color:#8fc4ff;
    font-size:13px;
    font-weight:700;
    margin-bottom:20px;
}

.section-title{
    margin:0;
    font-size:clamp(32px,4vw,48px);
    line-height:1.08;
    letter-spacing:-1.8px;
}

.section-description{
    color:var(--muted);
    line-height:1.75;
    font-size:17px;
    max-width:650px;
    margin-top:18px;
}

/* =====================================================
   HERO
===================================================== */

.hero{
    position:relative;
    overflow:hidden;
    padding:100px 0 85px;
}

.hero::before{
    content:"";
    position:absolute;
    width:650px;
    height:650px;
    border-radius:50%;
    background:rgba(47,140,255,.08);
    filter:blur(90px);
    top:-330px;
    left:50%;
    transform:translateX(-50%);
    pointer-events:none;
}

.hero-grid{
    display:grid;
    grid-template-columns:1.1fr .9fr;
    gap:70px;
    align-items:center;
}

.hero h1{
    margin:0;
    max-width:760px;
    font-size:clamp(46px,6vw,72px);
    line-height:.99;
    letter-spacing:-3.2px;
}

.hero h1 span{
    background:linear-gradient(90deg,#62adff,#2f8cff);
    -webkit-background-clip:text;
    color:transparent;
}

.hero-sub{
    max-width:650px;
    margin:25px 0 0;
    color:#aab9cc;
    font-size:19px;
    line-height:1.7;
}

.hero-buttons{
    display:flex;
    gap:12px;
    margin-top:34px;
}

.hero-buttons .btn{
    padding:15px 23px;
}

.hero-trust{
    display:flex;
    flex-wrap:wrap;
    gap:19px;
    margin-top:35px;
    color:#9aabc0;
    font-size:13px;
}

.hero-trust span{
    display:flex;
    align-items:center;
    gap:7px;
}

.check{
    color:var(--success);
}

/* =====================================================
   HERO PANEL
===================================================== */

.vehicle-panel{
    position:relative;
    background:
        linear-gradient(145deg,rgba(20,38,61,.97),rgba(10,24,42,.97));
    border:1px solid rgba(255,255,255,.1);
    border-radius:28px;
    padding:24px;
    box-shadow:var(--shadow);
}

.panel-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding-bottom:18px;
    border-bottom:1px solid var(--line);
}

.panel-title{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:750;
}

.live{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:12px;
    color:#8be7b8;
}

.live-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--success);
    box-shadow:0 0 15px var(--success);
}

.vehicle-card{
    margin-top:20px;
    border-radius:18px;
    padding:20px;
    background:rgba(255,255,255,.04);
    border:1px solid var(--line);
}

.vehicle-icon{
    width:54px;
    height:54px;
    border-radius:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(47,140,255,.12);
    font-size:25px;
    margin-bottom:17px;
}

.fake-line{
    height:9px;
    background:rgba(255,255,255,.1);
    border-radius:20px;
    margin-top:10px;
}

.fake-line.one{width:62%;}
.fake-line.two{width:88%;}
.fake-line.three{width:45%;}

.progress{
    margin-top:24px;
}

.progress-head{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:var(--muted);
    margin-bottom:9px;
}

.progress-bar{
    height:7px;
    border-radius:10px;
    overflow:hidden;
    background:rgba(255,255,255,.08);
}

.progress-value{
    width:68%;
    height:100%;
    border-radius:10px;
    background:linear-gradient(90deg,var(--primary),#63b2ff);
}

.panel-status{
    margin-top:18px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.status-box{
    padding:14px;
    border-radius:13px;
    background:rgba(255,255,255,.035);
    border:1px solid var(--line);
}

.status-box small{
    display:block;
    color:var(--muted);
    margin-bottom:5px;
}

.status-box strong{
    font-size:13px;
}

/* =====================================================
   TRUST BAR
===================================================== */

.trustbar{
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
    background:rgba(255,255,255,.018);
}

.trust-grid{
    min-height:100px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    align-items:center;
}

.trust-item{
    padding:15px 25px;
    border-right:1px solid var(--line);
}

.trust-item:last-child{
    border-right:none;
}

.trust-item strong{
    display:block;
    font-size:15px;
    margin-bottom:5px;
}

.trust-item span{
    color:var(--muted);
    font-size:12px;
}

/* =====================================================
   STEPS
===================================================== */

.center-heading{
    text-align:center;
}

.center-heading .section-description{
    margin-left:auto;
    margin-right:auto;
}

.steps{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
    margin-top:50px;
}

.step{
    position:relative;
    min-height:270px;
    padding:28px;
    background:linear-gradient(145deg,var(--card),rgba(13,29,49,.7));
    border:1px solid var(--line);
    border-radius:var(--radius);
}

.step-number{
    color:#6dafff;
    font-size:12px;
    font-weight:800;
    letter-spacing:1.5px;
}

.step-icon{
    margin:25px 0 22px;
    width:48px;
    height:48px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:13px;
    background:rgba(47,140,255,.1);
    font-size:23px;
}

.step h3{
    margin:0 0 11px;
    font-size:19px;
}

.step p{
    color:var(--muted);
    line-height:1.7;
    font-size:14px;
    margin:0;
}

/* =====================================================
   FEATURES
===================================================== */

.feature-layout{
    display:grid;
    grid-template-columns:.9fr 1.1fr;
    gap:70px;
    align-items:center;
}

.feature-list{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

.feature{
    padding:22px;
    border:1px solid var(--line);
    border-radius:18px;
    background:rgba(255,255,255,.025);
}

.feature-icon{
    width:40px;
    height:40px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:11px;
    background:rgba(47,140,255,.1);
    margin-bottom:15px;
}

.feature strong{
    display:block;
    margin-bottom:7px;
}

.feature span{
    color:var(--muted);
    font-size:13px;
    line-height:1.6;
}

/* =====================================================
   PRICING
===================================================== */

.pricing{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
    margin-top:50px;
}

.price-card{
    padding:30px;
    border-radius:22px;
    border:1px solid var(--line);
    background:var(--card);
}

.price-card.featured{
    border-color:rgba(47,140,255,.55);
    box-shadow:0 20px 60px rgba(47,140,255,.1);
}

.price-name{
    color:#c9d5e4;
    font-weight:700;
}

.price{
    margin:18px 0 4px;
    font-size:43px;
    font-weight:850;
    letter-spacing:-2px;
}

.price small{
    font-size:14px;
    color:var(--muted);
    letter-spacing:0;
}

.price-desc{
    min-height:50px;
    color:var(--muted);
    font-size:13px;
    line-height:1.6;
}

.price-features{
    margin-top:25px;
    padding-top:20px;
    border-top:1px solid var(--line);
    display:grid;
    gap:12px;
    font-size:13px;
    color:#cbd6e4;
}

/* =====================================================
   CTA
===================================================== */

.cta{
    padding:65px;
    border-radius:30px;
    background:
        radial-gradient(circle at 90% 10%,rgba(84,171,255,.2),transparent 35%),
        linear-gradient(135deg,#102b4d,#0b1c32);
    border:1px solid rgba(88,166,255,.2);
    text-align:center;
}

.cta h2{
    font-size:clamp(32px,4vw,47px);
    letter-spacing:-1.7px;
    margin:0;
}

.cta p{
    color:#afbed0;
    max-width:620px;
    margin:18px auto 28px;
    line-height:1.7;
}

/* =====================================================
   APP PAGES
===================================================== */

.app-shell{
    width:min(1100px,calc(100% - 40px));
    margin:45px auto 80px;
}

.app-card{
    background:linear-gradient(145deg,var(--card),#0b192a);
    border:1px solid var(--line);
    border-radius:25px;
    padding:32px;
    box-shadow:0 20px 60px rgba(0,0,0,.18);
}

.app-card h1{
    margin-top:0;
    font-size:30px;
}

.app-card p{
    color:var(--muted);
    line-height:1.7;
}

.form-group{
    margin-top:18px;
}

.form-group label{
    display:block;
    color:#c8d4e3;
    font-size:13px;
    font-weight:650;
    margin-bottom:8px;
}

.input{
    width:100%;
    padding:15px 16px;
    border-radius:11px;
    border:1px solid var(--line);
    outline:none;
    background:#081524;
    color:white;
    transition:.2s;
}

.input:focus{
    border-color:rgba(47,140,255,.65);
    box-shadow:0 0 0 3px rgba(47,140,255,.1);
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
}

.action-row{
    display:flex;
    gap:10px;
    margin-top:25px;
}

.upload{
    margin-top:25px;
    padding:35px;
    border:1px dashed rgba(88,166,255,.38);
    background:rgba(47,140,255,.04);
    border-radius:18px;
    text-align:center;
}

.upload-icon{
    font-size:35px;
}

.upload h3{
    margin-bottom:5px;
}

.upload p{
    margin-top:5px;
    font-size:13px;
}

/* =====================================================
   EXPEDIENTES
===================================================== */

.expedientes{
    display:grid;
    gap:13px;
    margin-top:25px;
}

.expediente{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    padding:20px;
    border-radius:16px;
    border:1px solid var(--line);
    background:rgba(255,255,255,.025);
}

.matricula{
    font-size:18px;
    font-weight:800;
}

.badge{
    display:inline-block;
    margin-top:7px;
    padding:5px 9px;
    border-radius:20px;
    background:rgba(47,140,255,.09);
    color:#82baff;
    font-size:11px;
}

/* =====================================================
   CHAT
===================================================== */

.chat{
    height:480px;
    overflow:auto;
    padding:20px;
    background:#071321;
    border:1px solid var(--line);
    border-radius:17px;
    display:flex;
    flex-direction:column;
    gap:12px;
    margin-top:22px;
}

.msg{
    max-width:75%;
    padding:13px 16px;
    border-radius:16px;
    line-height:1.5;
    font-size:14px;
    white-space:pre-wrap;
}

.msg.bot{
    align-self:flex-start;
    background:#15263b;
}

.msg.user{
    align-self:flex-end;
    background:var(--primary);
}

.chat-input{
    display:flex;
    gap:10px;
    margin-top:12px;
}

.chat-input input{
    flex:1;
}

/* =====================================================
   MODAL
===================================================== */

.modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:1000;
    padding:20px;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.7);
    backdrop-filter:blur(8px);
}

.modal-box{
    width:min(440px,100%);
    padding:30px;
    border-radius:24px;
    background:#0d1b2d;
    border:1px solid var(--line);
    box-shadow:var(--shadow);
}

.modal-box h2{
    margin-top:0;
}

.modal-box .input{
    margin-top:11px;
}

/* =====================================================
   FOOTER
===================================================== */

.footer{
    border-top:1px solid var(--line);
    padding:45px 0;
    color:var(--muted);
}

.footer-grid{
    display:flex;
    justify-content:space-between;
    gap:40px;
}

.footer-brand{
    max-width:380px;
}

.footer-brand p{
    font-size:13px;
    line-height:1.7;
}

.footer-links{
    display:flex;
    gap:55px;
}

.footer-col{
    display:grid;
    align-content:start;
    gap:10px;
    font-size:13px;
}

.footer-col strong{
    color:white;
    margin-bottom:4px;
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:900px){

    .desktop-nav,
    .header-actions{
        display:none;
    }

    .menu-mobile{
        display:block;
    }

    .mobile-panel{
        position:fixed;
        z-index:99;
        top:76px;
        left:0;
        right:0;
        padding:18px 20px 25px;
        background:#091625;
        border-bottom:1px solid var(--line);
        box-shadow:0 20px 40px rgba(0,0,0,.3);
    }

    .mobile-panel.open{
        display:block;
    }

    .mobile-panel .nav-link{
        display:block;
        padding:14px 4px;
        border-bottom:1px solid var(--line);
    }

    .mobile-actions{
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:10px;
        margin-top:18px;
    }

    .hero{
        padding-top:70px;
    }

    .hero-grid,
    .feature-layout{
        grid-template-columns:1fr;
        gap:45px;
    }

    .hero h1{
        max-width:700px;
    }

    .vehicle-panel{
        max-width:600px;
    }

    .trust-grid{
        grid-template-columns:1fr 1fr;
    }

    .trust-item:nth-child(2){
        border-right:none;
    }

    .trust-item{
        border-bottom:1px solid var(--line);
    }

    .steps,
    .pricing{
        grid-template-columns:1fr;
    }

    .price-desc{
        min-height:0;
    }

    .footer-grid{
        flex-direction:column;
    }
}

@media(max-width:600px){

    .header{
        height:68px;
    }

    .header-inner,
    .container,
    .app-shell{
        width:calc(100% - 28px);
    }

    .mobile-panel{
        top:68px;
    }

    .brand-name{
        font-size:19px;
    }

    .hero{
        padding:58px 0 55px;
    }

    .hero h1{
        font-size:43px;
        letter-spacing:-2px;
    }

    .hero-sub{
        font-size:16px;
    }

    .hero-buttons{
        display:grid;
        grid-template-columns:1fr;
    }

    .hero-buttons .btn{
        width:100%;
    }

    .hero-trust{
        display:grid;
        gap:10px;
    }

    .vehicle-panel{
        padding:18px;
        border-radius:21px;
    }

    .panel-status{
        grid-template-columns:1fr;
    }

    .trust-grid{
        grid-template-columns:1fr;
    }

    .trust-item{
        border-right:none;
    }

    .section{
        padding:65px 0;
    }

    .section-small{
        padding:50px 0;
    }

    .section-title{
        font-size:34px;
        letter-spacing:-1px;
    }

    .steps{
        margin-top:35px;
    }

    .step{
        min-height:0;
    }

    .feature-list{
        grid-template-columns:1fr;
    }

    .cta{
        padding:40px 20px;
        border-radius:23px;
    }

    .app-shell{
        margin-top:25px;
    }

    .app-card{
        padding:21px;
        border-radius:20px;
    }

    .form-grid{
        grid-template-columns:1fr;
        gap:0;
    }

    .action-row{
        flex-direction:column;
    }

    .action-row .btn{
        width:100%;
    }

    .upload{
        padding:25px 15px;
    }

    .expediente{
        align-items:flex-start;
        flex-direction:column;
    }

    .expediente .btn{
        width:100%;
    }

    .chat{
        height:55vh;
        padding:13px;
    }

    .msg{
        max-width:88%;
    }

    .chat-input{
        display:grid;
        grid-template-columns:1fr;
    }

    .footer-links{
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:30px;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="header-inner">

        <div class="brand" onclick="inicio()">
            <div class="brand-icon">G</div>
            <div class="brand-name">Gestor<span>-IA</span></div>
        </div>

        <nav class="desktop-nav">
            <span class="nav-link" onclick="comoFunciona()">Cómo funciona</span>
            <span class="nav-link" onclick="servicios()">Servicios</span>
            <span class="nav-link" onclick="quienesSomos()">Quiénes somos</span>
            <span class="nav-link" onclick="misExpedientes()">Mis expedientes</span>
            <span class="nav-link" onclick="ayuda()">Ayuda</span>
        </nav>

function limpiarTextoIA(texto){
    return String(texto ?? "")
        .replace(/Ã¡/g,"á")
        .replace(/Ã©/g,"é")
        .replace(/Ã­/g,"í")
        .replace(/Ã³/g,"ó")
        .replace(/Ãº/g,"ú")
        .replace(/Ã±/g,"ñ")
        .replace(/Ã‘/g,"Ñ")
        .replace(/Â¿/g,"¿")
        .replace(/Â¡/g,"¡")
        .replace(/â‚¬/g,"€")
        .replace(/Â/g,"")
        .replace(/\uFFFD/g,"");
}

function formatoEuro(valor){
    return Number(valor || 0).toLocaleString(
        "es-ES",
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    ) + " €";
}

function nombreUsuario(){

async function entrar(){

    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPass").value;

    try{

        const res = await fetch("/api/login",{
            method:"POST",
            headers:{
                "Content-Type":"application/json; charset=UTF-8"
            },
            body:JSON.stringify({email,password})
        });

        const data = await res.json();

        if(!data.ok){
            alert(limpiarTextoIA(data.error || "Login incorrecto."));
            return;
        }

        sesionActiva = true;
        usuarioActual = data.usuario || email;

        localStorage.setItem("gestorIA_token",data.access_token);

        if(data.refresh_token){
            localStorage.setItem("gestorIA_refresh_token",data.refresh_token);
        }

        cerrarModal();
        actualizarUsuario();
        misExpedientes();

    }catch(e){
        alert("No se pudo iniciar sesión.");
    }
}

async function crearCuenta(){

    const nombre = document.getElementById("regNombre").value.trim();
    const email = document.getElementById("regEmail").value.trim();
    const password = document.getElementById("regPass").value;

    try{

        const res = await fetch("/api/registro",{
            method:"POST",
            headers:{
                "Content-Type":"application/json; charset=UTF-8"
            },
            body:JSON.stringify({nombre,email,password})
        });

        const data = await res.json();

        if(!data.ok){
            alert(limpiarTextoIA(data.error || "No se pudo crear la cuenta."));
            return;
        }

        modalContenido.innerHTML = `
            <div style="font-size:45px">✉️</div>
            <h2>Revisa tu correo</h2>
            <p style="color:var(--muted)">
                Te hemos enviado un enlace para verificar tu cuenta.
            </p>

            <button class="btn btn-primary" onclick="login()">
                Iniciar sesión
            </button>
        `;

    }catch(e){
        alert("No se pudo crear la cuenta.");
    }
}

   RESTAURAR SESIÓN
========================= */

async function restaurarSesion(){

    const token = tokenActual();

    if(!token){
        inicio();
        return;
    }

    try{

        const res = await fetch("/api/sesion",{
            headers:{
                "Authorization":"Bearer " + token
            }
        });

        const data = await res.json();

        if(!res.ok || !data.ok){
            localStorage.removeItem("gestorIA_token");
            inicio();
            return;
        }

        sesionActiva = true;
        usuarioActual = data.usuario;

        actualizarUsuario();
        inicio();

    }catch(e){
        inicio();
    }
}

async function crearExpediente(){

    const matricula = document
        .getElementById("matriculaTraspaso")
        .value.trim()
        .replace(/\s/g,"")
        .toUpperCase();

    if(!matricula){
        alert("Introduce la matrícula.");
        return;
    }

    try{

        const res = await fetch("/api/expediente?action=crear",{
            method:"POST",
            headers:{
                "Content-Type":"application/json; charset=UTF-8",
                "Authorization":"Bearer " + tokenActual()
            },
            body:JSON.stringify({matricula})
        });

        const data = await res.json();

        if(!data.ok){
            alert(limpiarTextoIA(data.error || "No se pudo crear el expediente."));
            return;
        }

        expedienteActual = data.expediente;

        if(data.existente){

            if(confirm("Ya existe un expediente para esta matrícula. ¿Quieres continuarlo?")){
                continuarExpediente(expedienteActual);
            }else{
                misExpedientes();
            }

            return;
        }

        formularioParticipante();

    }catch(e){
        alert("No se pudo crear el expediente.");
    }
}

async function guardarParticipante(){

    const nombre = participanteNombre.value.trim();
    const dni_nie = participanteDni.value.trim();
    const telefono = participanteTelefono.value.trim();
    const email = participanteEmail.value.trim();
    const rol = participanteRol.value;

    if(!nombre || !dni_nie || !telefono || !email || !rol){
        alert("Completa todos los campos.");
        return;
    }

    try{

        const res = await fetch("/api/guardar-participante",{
            method:"POST",
            headers:{
                "Content-Type":"application/json; charset=UTF-8",
                "Authorization":"Bearer " + tokenActual()
            },
            body:JSON.stringify({
                expediente_id:expedienteActual.id,
                nombre,
                dni_nie,
                telefono,
                email,
                rol

function archivoABase64(archivo){

    return new Promise((resolve,reject)=>{

        const reader = new FileReader();

        reader.onload = ()=>{
            const resultado = String(reader.result || "");
            const coma = resultado.indexOf(",");

            if(coma === -1){
                reject(new Error("No se pudo leer la imagen."));
                return;
            }

            resolve(resultado.slice(coma + 1));
        };

        reader.onerror = ()=>reject(new Error("No se pudo leer la imagen."));
        reader.readAsDataURL(archivo);
    });
}

async function analizarFichaTecnica(){

    const input = document.getElementById("archivoFicha");
    const estado = document.getElementById("estadoFicha");
    const boton = document.getElementById("botonAnalizarFicha");

    const archivo = input?.files?.[0];

    if(!archivo){
        alert("Selecciona una fotografía.");
        return;
    }

    boton.disabled = true;
    estado.textContent = "Analizando ficha técnica...";

    try{

        const base64 = await archivoABase64(archivo);

        const res = await fetch("/api/analizar-ficha",{
            method:"POST",
            headers:{
                "Content-Type":"application/json; charset=UTF-8",
                "Authorization":"Bearer " + tokenActual()
            },
            body:JSON.stringify({
                expediente_id:expedienteActual.id,
                imagen_base64:base64,
                mime_type:archivo.type
            })
        });

        const data = await res.json();

        if(!res.ok || !data.ok){
            estado.textContent = limpiarTextoIA(
                data.error || "No se pudo analizar la ficha técnica."
            );
            boton.disabled = false;
            return;
        }

        estado.textContent = "Ficha recibida correctamente.";

        expedienteActual.paso_actual = data.paso_actual;

        setTimeout(abrirChat,800);

    }catch(e){

        estado.textContent = "No se pudo analizar la ficha técnica.";
        boton.disabled = false;
    }
}

function abrirChat(){

    contenido.innerHTML = `

function agregarMensaje(tipo,texto){

    const chat = document.getElementById("chat");

    const div = document.createElement("div");
    div.className = "msg " + tipo;
    div.textContent = limpiarTextoIA(texto);

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

async function iniciarConversacion(){

    try{

        const res = await fetch("/api/chat",{
            method:"POST",
            headers:{
                "Content-Type":"application/json; charset=UTF-8",
                "Authorization":"Bearer " + tokenActual()
            },
            body:JSON.stringify({
                expediente_id:expedienteActual.id,
                mensaje:""
            })
        });

        const data = await res.json();

        agregarMensaje("bot",data.respuesta || data.error || "No se pudo iniciar la conversación.");

        if(data.solicitar_calculo === true){
            setTimeout(calcularCosteFiscal,800);
        }

    }catch(e){
        agregarMensaje("bot","No se pudo conectar con Gestor-IA.");
    }
}

async function enviarMensaje(){

    const input = document.getElementById("mensaje");
    const texto = input.value.trim();

    if(!texto) return;

    agregarMensaje("user",texto);
    input.value = "";

    try{

        const res = await fetch("/api/chat",{
            method:"POST",
            headers:{
                "Content-Type":"application/json; charset=UTF-8",
                "Authorization":"Bearer " + tokenActual()
            },
            body:JSON.stringify({
                expediente_id:expedienteActual.id,
                mensaje:texto
            })
        });

        const data = await res.json();

        agregarMensaje("bot",data.respuesta || data.error || "No se pudo responder.");

        expedienteActual.paso_actual = data.paso_actual;

        if(data.solicitar_calculo === true){
            setTimeout(calcularCosteFiscal,800);
        }

    }catch(e){
        agregarMensaje("bot","Error de conexión.");
    }
}

        const res = await fetch("/api/expediente?action=listar",{

        });

        const data = await res.json();

        if(!data.ok){
            throw new Error(data.error);
        }

        window.expedientesCargados = data.expedientes || [];

        let lista = "";

        window.expedientesCargados.forEach((exp,index)=>{

            lista += `
            <div class="expediente">

                <div>
                    <div class="matricula">
                        🚗 ${limpiarTextoIA(exp.matricula)}

                    <span class="badge">

                <button

                    ${exp.estado === "FINALIZADO" ? "Ver" : "Continuar"} →
                </button>

            </div>
            `;
        });

        contenido.innerHTML = `
        <div class="app-shell">
            <div class="app-card">

                <div class="eyebrow">MI CUENTA</div>

                <h1>Mis expedientes</h1>

                <p>
                    Consulta y continúa tus operaciones.
                </p>

                <div class="action-row">
                    <button class="btn btn-primary" onclick="nuevoTraspaso()">
                        + Nuevo traspaso
                    </button>
                </div>

                <div class="expedientes">
                    ${
                        lista ||
                        `<p>Todavía no tienes ningún expediente.</p>`
                    }
                </div>

            </div>
        </div>
        `;

    }catch(e){

        contenido.innerHTML = `
        <div class="app-shell">
            <div class="app-card">
                <h1>Mis expedientes</h1>
                <p>No se pudieron cargar los expedientes.</p>
            </div>
        </div>
        `;
    }
}

function continuarExpedientePorIndice(index){

    const exp = window.expedientesCargados?.[index];

    if(exp){
        continuarExpediente(exp);
    }
}

function textoEstado(estado){

    const estados = {
        CREADO:"Datos pendientes",
        FICHA_TECNICA:"Ficha técnica pendiente",
        DATOS_INICIALES:"Recogiendo datos",
        IDENTIFICANDO_VEHICULO:"Identificando vehículo",
        DATOS_FISCALES:"Comprobación fiscal",
        CALCULO_FISCAL:"Calculando",
        FACTURA_PENDIENTE:"Factura pendiente",
        PAGO_PENDIENTE:"Pendiente de pago",
        PAGO_VALIDADO:"Pago confirmado",
        INVITACION_GENERADA:"Esperando participante",
        FINALIZADO:"Finalizado"
    };

    return estados[estado] || estado;
}

function continuarExpediente(exp){

    expedienteActual = exp;

    switch(exp.estado){

        case "CREADO":
            formularioParticipante();
            break;

        case "FICHA_TECNICA":
            pantallaFichaTecnica();
            break;

        case "DATOS_INICIALES":
        case "IDENTIFICANDO_VEHICULO":
        case "DATOS_FISCALES":
            abrirChat();
            break;

        case "CALCULO_FISCAL":
            calcularCosteFiscal();
            break;

        case "PAGO_PENDIENTE":
            calcularCosteFiscal();
            break;

        case "PAGO_VALIDADO":
        case "INVITACION_GENERADA":
            pantallaPostPago();
            break;

        case "FINALIZADO":
            contenido.innerHTML = `
            <div class="app-shell">
                <div class="app-card">
                    <div style="font-size:45px">✓</div>
                    <h1>Expediente finalizado</h1>
                    <p>
                        El expediente del vehículo
                        <strong>${limpiarTextoIA(exp.matricula)}</strong>
                        consta como finalizado.
                    </p>
                </div>
            </div>
            `;
            break;

        default:
            abrirChat();
    }
}
