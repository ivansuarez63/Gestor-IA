let sesionActiva = false;
let usuarioActual = null;
let expedienteActual = null;


/* =============================
   SESIÓN
============================= */

function requiereSesion(){

    const token =
        localStorage.getItem("gestorIA_token");

    if(!sesionActiva || !token){

        login();

        return false;
    }

    return true;
}


/* =============================
   RESTAURAR SESIÓN
============================= */

async function restaurarSesion(){

    const token =
        localStorage.getItem("gestorIA_token");

    if(!token){

        sesionActiva = false;
        usuarioActual = null;

        inicio();

        return;
    }

    try{

        const res =
            await fetch(
                "/api/sesion",
                {
                    method:"GET",

                    headers:{
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );

        const data =
            await res.json();

        if(!res.ok || !data.ok){

            localStorage.removeItem(
                "gestorIA_token"
            );

            localStorage.removeItem(
                "gestorIA_refresh_token"
            );

            sesionActiva=false;
            usuarioActual=null;

            inicio();

            return;
        }

        sesionActiva=true;

        usuarioActual=
            data.usuario;

        actualizarUsuario();

        panel();

    }catch(error){

        console.error(
            "Error restaurando sesión:",
            error
        );

        inicio();
    }
}

/* =============================
   LOGIN
============================= */

function login(){

    modalContenido.innerHTML=`

        <h2>
            Iniciar sesión
        </h2>

        <input
            id="loginEmail"
            placeholder="Correo"
        >

        <input
            id="loginPass"
            type="password"
            placeholder="Contraseña"
        >

        <br><br>

        <button onclick="entrar()">
            Entrar
        </button>

        <button
            class="btn-secundario"
            onclick="registro()">
            Crear cuenta
        </button>

    `;

    modal.style.display="flex";
}


async function entrar(){

    const email =
        document
        .getElementById("loginEmail")
        .value;

    const password =
        document
        .getElementById("loginPass")
        .value;

    try{

        const res =
            await fetch(
                "/api/login",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                        "application/json"
                    },

                    body:JSON.stringify({
                        email,
                        password
                    })
                }
            );

        const data =
            await res.json();

        if(!data.ok){

            alert(
                data.error ||
                "Login incorrecto."
            );

            return;
        }

        sesionActiva=true;

        usuarioActual =
            data.usuario || email;

        localStorage.setItem(
            "gestorIA_token",
            data.access_token
        );

        if(data.refresh_token){

            localStorage.setItem(
                "gestorIA_refresh_token",
                data.refresh_token
            );
        }

        modal.style.display="none";

        actualizarUsuario();

        panel();

    }catch(e){

        alert(
            "No se pudo iniciar sesión."
        );
    }
}

async function crearCuenta(){

        .getElementById("regNombre")
        .value;

    const email =
        document
        .getElementById("regEmail")
        .value;

    const password =
        document
        .getElementById("regPass")
        .value;

    try{

        const res =
            await fetch(
                "/api/registro",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                        "application/json"
                    },

                    body:JSON.stringify({
                        nombre,
                        email,
                        password
                    })
                }
            );

        const data =
            await res.json();

        if(data.ok){

            modalContenido.innerHTML=`

                <h2>
                    ✉️ Revisa tu correo
                </h2>

                <p>
                    Te hemos enviado un enlace
                    para verificar tu cuenta.
                </p>

                <button onclick="login()">
                    Iniciar sesión
                </button>

            `;

        }else{

            alert(
                data.error ||
                "No se pudo crear la cuenta."
            );
        }

    }catch(e){

        alert(
            "No se pudo crear la cuenta."
        );
    }
}

   USUARIO
============================= */

function actualizarUsuario(){

    usuario.innerHTML=`

            👤 ${usuarioActual}
        </span>

        <button
            class="btn-secundario"
            onclick="cerrarSesion()">

}


function cerrarSesion(){

    localStorage.removeItem(
        "gestorIA_token"
    );

    localStorage.removeItem(
        "gestorIA_refresh_token"
    );

    sesionActiva=false;
    usuarioActual=null;
    expedienteActual=null;

    location.reload();
}

/* =============================
   NUEVO TRASPASO
============================= */

function nuevoTraspaso(){

    if(!requiereSesion()) return;

    contenido.innerHTML=`

        <div class="card">

            <h1>
                🚗 Iniciar traspaso
            </h1>

            <p>
                Introduce la matrícula
                del vehículo.
            </p>

            <input
                id="matriculaTraspaso"
                placeholder="1234ABC"
            >

            <br><br>

            <button onclick="crearExpediente()">
                Continuar
            </button>

        </div>

    `;
}


async function crearExpediente(){

    const matricula =
        document
        .getElementById(
            "matriculaTraspaso"
        )
        .value
        .trim()
        .toUpperCase();

    if(!matricula){

        alert(
            "Introduce la matrícula."
        );

        return;
    }

    const token =
        localStorage.getItem(
            "gestorIA_token"
        );

    const res =
        await fetch(
            "/api/crear-expediente",
            {
                method:"POST",

                headers:{
                    "Content-Type":
                        "application/json",

                    "Authorization":
                        "Bearer " + token
                },

                body:JSON.stringify({
                    matricula
                })
            }
        );

    const data =
        await res.json();

    if(!data.ok){

        alert(
            data.error ||
            "No se pudo crear el expediente."
        );

        return;
    }

    expedienteActual =
        data.expediente;

    formularioParticipante();
}

                    </select>

            </button>

async function guardarParticipante(){

    const nombre =
        document
        .getElementById("participanteNombre")
        .value
        .trim();

    const dni_nie =
        document
        .getElementById("participanteDni")
        .value
        .trim();

    const telefono =
        document
        .getElementById("participanteTelefono")
        .value
        .trim();

    const email =
        document
        .getElementById("participanteEmail")
        .value
        .trim();

    const rol =
        document
        .getElementById("participanteRol")
        .value;

    if(
        !nombre ||
        !dni_nie ||
        !telefono ||
        !email ||
        !rol
    ){

        alert(
            "Completa todos los campos."
        );

        return;
    }

    const token =
        localStorage.getItem(
            "gestorIA_token"
        );

    const res =
        await fetch(
            "/api/guardar-participante",
            {
                method:"POST",

                headers:{
                    "Content-Type":
                        "application/json",

                    "Authorization":
                        "Bearer " + token
                },

                body:JSON.stringify({

                    expediente_id:
                        expedienteActual.id,

                    nombre,
                    dni_nie,
                    telefono,
                    email,
                    rol
                })
            }
        );

    const data =
        await res.json();

    if(!data.ok){

        alert(
            data.error ||
            "No se pudieron guardar los datos."
        );

        return;
    }

    abrirChat();
}

async function abrirChat(){

                    onclick="enviarMensaje()">
                    Enviar

            </div>

        </div>

    document
        .getElementById("mensaje")

            }
        );

    await iniciarConversacion();
}


async function iniciarConversacion(){

    const token =
        localStorage.getItem(
            "gestorIA_token"
        );

    try{

        const res =
            await fetch(
                "/api/chat",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " + token
                    },

                    body:JSON.stringify({
                        expediente_id:
                            expedienteActual.id,
                        mensaje:""
                    })
                }
            );

        const data =
            await res.json();

        if(!res.ok){

            agregarMensaje(
                "bot",
                data.error ||
                "No se pudo iniciar la conversación."
            );

            return;
        }

        agregarMensaje(
            "bot",
            data.respuesta
        );

    }catch(error){

        agregarMensaje(
            "bot",
            "No se pudo iniciar Gestor-IA."
        );
    }
}


function agregarMensaje(tipo,texto){

    const chat =
        document.getElementById("chat");

    if(!chat) return;

    const div =
        document.createElement("div");

    div.className=tipo;

    const span =
        document.createElement("span");

    span.textContent=texto;

    div.appendChild(span);

    chat.appendChild(div);

    chat.scrollTop =
        chat.scrollHeight;
}


async function enviarMensaje(){

    const input =
        document.getElementById("mensaje");

    const mensaje =
        input.value.trim();

    if(!mensaje) return;

    agregarMensaje(
        "user",
        mensaje
    );

    input.value="";

    agregarMensaje(
        "bot",
        "Pensando..."
    );

    const token =
        localStorage.getItem(
            "gestorIA_token"
        );

    try{

        const res =
            await fetch(
                "/api/chat",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " + token
                    },

                    body:JSON.stringify({
                        expediente_id:
                            expedienteActual.id,
                        mensaje
                    })
                }
            );

        const data =
            await res.json();

        const chat =
            document.getElementById("chat");

        if(chat?.lastChild){

            chat.removeChild(
                chat.lastChild
            );
        }

        if(!res.ok){

            agregarMensaje(
                "bot",
                data.error ||
                "No se pudo responder."
            );

            return;
        }

        agregarMensaje(
            "bot",
            data.respuesta
        );

        if(
            data.paso_actual ===
            "PAGO_PENDIENTE"
        ){

            setTimeout(
                pantallaPago,
                1200
            );
        }

    }catch(e){

        const chat =
            document.getElementById("chat");

        if(chat?.lastChild){

            chat.removeChild(
                chat.lastChild
            );
        }

        agregarMensaje(
            "bot",
            "Error de conexión."
        );
    }
}
