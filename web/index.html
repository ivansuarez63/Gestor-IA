<!DOCTYPE html>
<html lang="es">

<style>

*{

}

body{
    margin:0;

header{

button{

.menu{

.content{

.card{

.hero-botones{

.seguridad,

input,

.campo{

.campo label{

}

#chat{
    height:500px;
    overflow-y:auto;

    padding:25px;
    border-radius:18px;

    flex-direction:column;

}

.user{

}

.user span{

}

.bot{

}

.bot span{
    background:#1e293b;
    padding:14px 18px;

}

.fila-chat{
    display:flex;
    gap:10px;
}

.fila-chat input{
    max-width:none;
    flex:1;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:#000a;
    align-items:center;
    justify-content:center;
    z-index:1000;
}

.modal-box{
    background:#111827;
    padding:30px;
    border-radius:20px;
    width:400px;
    max-width:90%;
}

.expedientes-grid{
    display:grid;
    gap:15px;
    margin-top:25px;
}

.expediente-top{
    display:flex;
    justify-content:space-between;
    gap:20px;
    align-items:center;
}

.expediente-matricula{
    font-size:23px;
    font-weight:bold;
    color:#38bdf8;
}

.estado-pill{
    display:inline-block;
    padding:7px 11px;
    background:#1e293b;

}

.linea-pago{

    justify-content:space-between;
    gap:20px;

}

.total{

}

.enlace-invitacion{
    width:100%;

    background:#111827;
    color:white;
}

@media(max-width:900px){

    .servicios-grid{

}

@media(max-width:800px){

    .container{
        grid-template-columns:1fr;
    }

    }
}

</style>

</head>

</div>

class="modal"

class="modal-box"
id="modalContenido">
</div>

<script>

let sesionActiva=false;
let usuarioActual=null;
let expedienteActual=null;


/* =============================
   SESIÓN
============================= */

function tokenActual(){

    return localStorage.getItem(
        "gestorIA_token"
    );
}


function requiereSesion(){

    if(
        !sesionActiva ||
        !tokenActual()
    ){

        login();

        return false;
    }

    return true;
}


async function restaurarSesion(){

    const token =
        tokenActual();

    if(!token){

        inicio();

        return;
    }

    try{

        const res =
            await fetch(
                "/api/sesion",
                {
                    headers:{
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );

        const data =
            await res.json();

        if(!res.ok || !data.ok){

            localStorage.removeItem(
                "gestorIA_token"
            );

            localStorage.removeItem(
                "gestorIA_refresh_token"
            );

            inicio();

            return;
        }

        sesionActiva=true;
        usuarioActual=data.usuario;

        actualizarUsuario();

        inicio();

    }catch(error){

        inicio();
    }
}

============================= */

}

/* =============================
   LOGIN
============================= */

function login(){

    modalContenido.innerHTML=`

    <h2>
        Iniciar sesión
    </h2>

    <input
        id="loginEmail"
        placeholder="Correo">

    <input
        id="loginPass"
        type="password"
        placeholder="Contraseña">

    <br><br>

    <button onclick="entrar()">
        Entrar
    </button>

    <button
        class="btn-secundario"
        onclick="registro()">
        Crear cuenta
    </button>

    `;

    modal.style.display="flex";
}


async function entrar(){

    const email =
        document
        .getElementById(
            "loginEmail"
        ).value;

    const password =
        document
        .getElementById(
            "loginPass"
        ).value;

    try{

        const res =
            await fetch(
                "/api/login",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({
                        email,
                        password
                    })
                }
            );

        const data =
            await res.json();

        if(!data.ok){

            alert(
                data.error ||
                "Login incorrecto."
            );

            return;
        }

        sesionActiva=true;

        usuarioActual=
            data.usuario || email;

        localStorage.setItem(
            "gestorIA_token",
            data.access_token
        );

        if(data.refresh_token){

            localStorage.setItem(
                "gestorIA_refresh_token",
                data.refresh_token
            );
        }

        modal.style.display="none";

        actualizarUsuario();

        inicio();

    }catch(error){

        alert(
            "No se pudo iniciar sesión."
        );
    }
}


/* =============================
   REGISTRO
============================= */

function registro(){

    modalContenido.innerHTML=`

    <h2>

    <input
        id="regNombre"
        placeholder="Nombre">

    <input
        id="regEmail"
        type="email"
        placeholder="Correo">

    <input
        id="regPass"
        type="password"
        placeholder="Contraseña">

    <br><br>

    <button onclick="crearCuenta()">
        Crear cuenta
    </button>

    `;

    modal.style.display="flex";

async function crearCuenta(){

    const nombre =
        document
        .getElementById(
            "regNombre"
        ).value;

    const email =
        document
        .getElementById(
            "regEmail"
        ).value;

    const password =
        document
        .getElementById(
            "regPass"
        ).value;

    try{

        const res =
            await fetch(
                "/api/registro",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({
                        nombre,
                        email,
                        password
                    })
                }
            );

        const data =
            await res.json();

        if(data.ok){

            modalContenido.innerHTML=`

            <h2>
                ✉️ Revisa tu correo
            </h2>

            <p>
                Te hemos enviado un enlace
                para verificar tu cuenta.
            </p>

            <button onclick="login()">
                Iniciar sesión
            </button>

            `;

        }else{

            alert(
                data.error ||
                "No se pudo crear la cuenta."
            );
        }

    }catch(error){

        alert(
            "No se pudo crear la cuenta."
        );
    }
}


/* =============================
   USUARIO
============================= */

function actualizarUsuario(){

    usuario.innerHTML=`

    <span>
        👤 ${usuarioActual}
    </span>

    <button
        class="btn-secundario"
        onclick="cerrarSesion()">
        Salir
    </button>

    `;
}


function cerrarSesion(){

    localStorage.removeItem(
        "gestorIA_token"
    );

    localStorage.removeItem(
        "gestorIA_refresh_token"
    );

    sesionActiva=false;
    usuarioActual=null;
    expedienteActual=null;

    location.reload();
}


/* =============================
   NUEVO TRASPASO
============================= */

function nuevoTraspaso(){

    if(!requiereSesion()) return;

    contenido.innerHTML=`

    <div class="card">

        <h1>
            🚗 Iniciar traspaso
        </h1>

        <p>
            Introduce la matrícula.
            El expediente se guardará
            desde este momento.
        </p>

        <input
            id="matriculaTraspaso"
            placeholder="1234ABC">

        <br><br>

        <button onclick="crearExpediente()">
            Continuar
        </button>

    </div>

    `;
}


async function crearExpediente(){

    const matricula =
        document
        .getElementById(
            "matriculaTraspaso"
        )
        .value
        .trim()
        .toUpperCase();

    if(!matricula){

        alert(
            "Introduce la matrícula."
        );

        return;
    }

    try{

        const res =
            await fetch(
                "/api/expediente?action=crear",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " +
                            tokenActual()
                    },

                    body:JSON.stringify({
                        matricula
                    })
                }
            );

        const data =
            await res.json();

        if(!data.ok){

            alert(
                data.error ||
                "No se pudo crear el expediente."
            );

            return;
        }

        expedienteActual=
            data.expediente;

        if(data.existente){

            const seguir =
                confirm(
                    "Ya tienes un expediente activo para esta matrícula. ¿Quieres continuarlo?"
                );

            if(seguir){

                continuarExpediente(
                    expedienteActual
                );

            }else{

                misExpedientes();
            }

            return;
        }

        formularioParticipante();

    }catch(error){

        alert(
            "No se pudo crear el expediente."
        );
    }
}


/* =============================
   PARTICIPANTE
============================= */

function formularioParticipante(){

    contenido.innerHTML=`

    <div class="card">

        <h1>
            Tus datos
        </h1>

        <p>
            Vehículo:
            <b>
                ${expedienteActual.matricula}
            </b>
        </p>

        <div class="campo">

            <label>
                Nombre y apellidos
            </label>

            <input
                id="participanteNombre"
                placeholder="Nombre completo">

        </div>

        <div class="campo">

            <label>
                DNI / NIE
            </label>

            <input
                id="participanteDni"
                placeholder="DNI o NIE">

        </div>

        <div class="campo">

            <label>
                Teléfono
            </label>

            <input
                id="participanteTelefono"
                placeholder="Teléfono">

        </div>

        <div class="campo">

            <label>
                Correo
            </label>

            <input
                id="participanteEmail"
                type="email"
                placeholder="Correo electrónico">

        </div>

        <div class="campo">

            <label>
                En este traspaso eres:
            </label>

            <select
                id="participanteRol">

                <option value="">
                    Selecciona
                </option>

                <option value="COMPRADOR">
                    Comprador
                </option>

                <option value="VENDEDOR">
                    Vendedor
                </option>

            </select>

        </div>

        <br>

        <button
            onclick="guardarParticipante()">
            Continuar
        </button>

    </div>

    `;
}


async function guardarParticipante(){

    const nombre =
        document
        .getElementById(
            "participanteNombre"
        ).value.trim();

    const dni_nie =
        document
        .getElementById(
            "participanteDni"
        ).value.trim();

    const telefono =
        document
        .getElementById(
            "participanteTelefono"
        ).value.trim();

    const email =
        document
        .getElementById(
            "participanteEmail"
        ).value.trim();

    const rol =
        document
        .getElementById(
            "participanteRol"
        ).value;

    if(
        !nombre ||
        !dni_nie ||
        !telefono ||
        !email ||
        !rol
    ){

        alert(
            "Completa todos los campos."
        );

        return;
    }

    try{

        const res =
            await fetch(
                "/api/guardar-participante",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " +
                            tokenActual()
                    },

                    body:JSON.stringify({

                        expediente_id:
                            expedienteActual.id,

                        nombre,
                        dni_nie,
                        telefono,
                        email,
                        rol

                    })
                }
            );

        const data =
            await res.json();

        if(!data.ok){

            alert(
                data.error ||
                "No se pudieron guardar los datos."
            );

            return;
        }

        expedienteActual.estado=
            "DATOS_INICIALES";

        abrirChat();

    }catch(error){

        alert(
            "No se pudieron guardar los datos."
        );
    }
}


/* =============================
   CHAT
============================= */

async function abrirChat(){

    contenido.innerHTML=`

    <div class="card">

        <h1>
            🚗 ${expedienteActual.matricula}
        </h1>

        <div class="estado">
            🤖 Gestor-IA está gestionando
            este expediente.
        </div>

        <div id="chat"></div>

        <div class="fila-chat">

            <input
                id="mensaje"
                placeholder="Escribe tu respuesta...">

            <button
                onclick="enviarMensaje()">
                Enviar
            </button>

        </div>

    </div>

    `;

    document
    .getElementById("mensaje")
    .addEventListener(
        "keydown",
        function(e){

            if(e.key==="Enter"){

                enviarMensaje();
            }
        }
    );

    await iniciarConversacion();
}


async function iniciarConversacion(){

    try{

        const res =
            await fetch(
                "/api/chat",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " +
                            tokenActual()
                    },

                    body:JSON.stringify({

                        expediente_id:
                            expedienteActual.id,

                        mensaje:""

                    })
                }
            );

        const data =
            await res.json();

        if(!res.ok){

            agregarMensaje(
                "bot",
                data.error ||
                "No se pudo iniciar la conversación."
            );

            return;
        }

        agregarMensaje(
            "bot",
            data.respuesta
        );

        if(
            data.paso_actual ===
            "PAGO_PENDIENTE"
        ){

            expedienteActual.estado=
                "PAGO_PENDIENTE";

            setTimeout(
                pantallaPago,
                800
            );
        }

    }catch(error){

        agregarMensaje(
            "bot",
            "No se pudo iniciar Gestor-IA."
        );
    }
}


function agregarMensaje(
    tipo,
    texto
){

    const chat =
        document.getElementById(
            "chat"
        );

    if(!chat) return;

    const div =
        document.createElement(
            "div"
        );

    div.className=tipo;

    const span =
        document.createElement(
            "span"
        );

    span.textContent=texto;

    div.appendChild(span);

    chat.appendChild(div);

    chat.scrollTop=
        chat.scrollHeight;
}


async function enviarMensaje(){

    const input =
        document.getElementById(
            "mensaje"
        );

    const mensaje =
        input.value.trim();

    if(!mensaje) return;

    agregarMensaje(
        "user",
        mensaje
    );

    input.value="";

    agregarMensaje(
        "bot",
        "Pensando..."
    );

    try{

        const res =
            await fetch(
                "/api/chat",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " +
                            tokenActual()
                    },

                    body:JSON.stringify({

                        expediente_id:
                            expedienteActual.id,

                        mensaje

                    })
                }
            );

        const data =
            await res.json();

        const chat =
            document.getElementById(
                "chat"
            );

        if(chat?.lastChild){

            chat.removeChild(
                chat.lastChild
            );
        }

        if(!res.ok){

            agregarMensaje(
                "bot",
                data.error ||
                "No se pudo responder."
            );

            return;
        }

        agregarMensaje(
            "bot",
            data.respuesta
        );

        if(
            data.paso_actual ===
            "PAGO_PENDIENTE"
        ){

            expedienteActual.estado=
                "PAGO_PENDIENTE";

            setTimeout(
                pantallaPago,
                900
            );
        }

    }catch(error){

        agregarMensaje(
            "bot",
            "Error de conexión."
        );
    }
}

async function simularPago(){

    if(
        !confirm(
            "¿Simular el pago de este expediente?"
        )
    ){
        return;
    }

    try{

        const res =
            await fetch(
                "/api/expediente?action=simular-pago",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " +
                            tokenActual()
                    },

                    body:JSON.stringify({
                        expediente_id:
                            expedienteActual.id
                    })
                }
            );

        const data =
            await res.json();

        if(!res.ok || !data.ok){

            alert(
                data.error ||
                "No se pudo simular el pago."
            );

            return;
        }

        expedienteActual=
            data.expediente;

        pantallaPostPago();

    }catch(error){

        alert(
            "No se pudo simular el pago."
        );
    }
}

/* =============================
   MIS EXPEDIENTES
============================= */

async function misExpedientes(){

    if(!requiereSesion()) return;

    contenido.innerHTML=`

    <div class="card">

        <h1>
            📁 Mis expedientes
        </h1>

        <p>
            Cargando expedientes...
        </p>

    </div>

    `;

    try{

        const res =
            await fetch(
                "/api/expediente?action=listar",
                {
                    method:"GET",

                    headers:{
                        "Authorization":
                            "Bearer " +
                            tokenActual()
                    }
                }
            );

        const data =
            await res.json();

        if(!res.ok || !data.ok){

            contenido.innerHTML=`

            <div class="card">

                <h1>
                    📁 Mis expedientes
                </h1>

                <p>
                    ${data.error ||
                    "No se pudieron cargar."}
                </p>

            </div>

            `;

            return;
        }

        if(
            !data.expedientes.length
        ){

            contenido.innerHTML=`

            <div class="card">

                <h1>
                    📁 Mis expedientes
                </h1>

                <p>
                    Todavía no tienes
                    ningún expediente.
                </p>

                <button
                    onclick="nuevoTraspaso()">

                    Iniciar traspaso

                </button>

            </div>

            `;

            return;
        }

        let tarjetas="";

        data.expedientes.forEach(
            function(exp,index){

                tarjetas += `

                <div class="expediente-card">

                    <div class="expediente-top">

                        <div>

                            <div class="expediente-matricula">
                                🚗 ${exp.matricula}
                            </div>

                            <br>

                            <span class="estado-pill">
                                ${textoEstado(exp.estado)}
                            </span>

                        </div>

                        <button
                            onclick="continuarExpedientePorIndice(${index})">

                            ${
                                exp.estado ===
                                "FINALIZADO"
                                ?
                                "Ver expediente"
                                :
                                "Continuar"
                            }

                        </button>

                    </div>

                </div>

                `;
            }
        );

        window.expedientesCargados =
            data.expedientes;

        contenido.innerHTML=`

        <div class="card">

            <h1>
                📁 Mis expedientes
            </h1>

            <div class="expedientes-grid">

                ${tarjetas}

            </div>

        </div>

        `;

    }catch(error){

        contenido.innerHTML=`

        <div class="card">

            <h1>
                📁 Mis expedientes
            </h1>

            <p>
                No se pudieron cargar.
            </p>

        </div>

        `;
    }
}


function continuarExpedientePorIndice(index){

    const exp =
        window.expedientesCargados?.[index];

    if(!exp) return;

    continuarExpediente(exp);
}


function textoEstado(estado){

    const nombres={

        CREADO:
            "Datos pendientes",

        DATOS_INICIALES:
            "Recogiendo datos",

        PAGO_PENDIENTE:
            "Pendiente de pago",

        PAGO_VALIDADO:
            "Pago confirmado",

        INVITACION_GENERADA:
            "Esperando participante",

        FINALIZADO:
            "Finalizado ✅"

    };

    return nombres[estado] ||
        estado;
}


/* =============================
   CONTINUAR EXPEDIENTE
============================= */

function continuarExpediente(exp){

    expedienteActual=exp;

    switch(exp.estado){

        case "CREADO":

            formularioParticipante();

            break;


        case "DATOS_INICIALES":

            abrirChat();

            break;


        case "PAGO_PENDIENTE":

            pantallaPago();

            break;


        case "PAGO_VALIDADO":

            pantallaPostPago();

            break;


        case "INVITACION_GENERADA":

            pantallaPostPago();

            break;


        case "FINALIZADO":

            contenido.innerHTML=`

            <div class="card">

                <h1>
                    ✅ Traspaso finalizado
                </h1>

                <p>
                    Matrícula:
                    <b>
                        ${exp.matricula}
                    </b>
                </p>

                <div class="estado">
                    Este expediente consta
                    como finalizado.
                </div>

            </div>

            `;

            break;


        default:

            abrirChat();
    }
}
