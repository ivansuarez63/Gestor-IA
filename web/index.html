<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
Gestor-IA | Traspasos de vehículos
</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Segoe UI,Arial,sans-serif;
    background:#0b1220;
    color:white;
}

header{
    height:80px;
    background:#111827;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 35px;
    border-bottom:1px solid #1e293b;
}

.logo{
    font-size:30px;
    font-weight:bold;
    color:#38bdf8;
}

button{
    background:#38bdf8;
    border:0;
    padding:12px 18px;
    border-radius:12px;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    opacity:.85;
}

.btn-secundario{
    background:#1e293b;
    color:white;
}

#usuario{
    display:flex;
    align-items:center;
    gap:10px;
}

.container{
    display:grid;
    grid-template-columns:220px 1fr;
    min-height:calc(100vh - 80px);
}

.menu{
    background:#111827;
    padding:20px;
}

.menu div{
    background:#1e293b;
    padding:15px;
    margin-bottom:15px;
    border-radius:12px;
    cursor:pointer;
}

.menu div:hover{
    background:#273449;
}

.content{
    padding:25px;
    display:flex;
    justify-content:center;
}

.card{
    width:100%;
    max-width:1100px;
    background:#111827;
    padding:30px;
    border-radius:22px;
}

.hero{
    padding:40px;
}

.hero h1{
    font-size:44px;
}

.hero p{
    color:#cbd5e1;
    font-size:18px;
    line-height:1.6;
}

input,
select{
    width:100%;
    max-width:500px;
    padding:15px;
    margin:7px 0;
    border:0;
    border-radius:11px;
    font-size:16px;
}

.formulario{
    margin-top:25px;
}

.campo{
    margin-bottom:15px;
}

.campo label{
    display:block;
    color:#94a3b8;
    margin-bottom:3px;
}

#chat{
    height:500px;
    overflow-y:auto;
    background:#070d18;
    padding:25px;
    border-radius:18px;
    display:flex;
    flex-direction:column;
    gap:15px;
    margin:20px 0 15px;
}

.user{
    display:flex;
    justify-content:flex-end;
}

.user span{
    background:#38bdf8;
    color:#071018;
    padding:14px 18px;
    border-radius:18px;
    max-width:75%;
}

.bot{
    display:flex;
    justify-content:flex-start;
}

.bot span{
    background:#1e293b;
    padding:14px 18px;
    border-radius:18px;
    max-width:75%;
}

.fila-chat{
    display:flex;
    gap:10px;
}

.fila-chat input{
    max-width:none;
    flex:1;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:#000a;
    align-items:center;
    justify-content:center;
    z-index:1000;
}

.modal-box{
    background:#111827;
    padding:30px;
    border-radius:20px;
    width:400px;
    max-width:90%;
}

.estado{
    background:#0b1220;
    padding:18px;
    border-radius:14px;
    margin:20px 0;
}

@media(max-width:800px){

    .container{
        grid-template-columns:1fr;
    }

    .menu{
        display:none;
    }

}

</style>

</head>

<body>

<header>

<div class="logo">
Gestor-IA
</div>

<div id="usuario">

<button
    class="btn-secundario"
    onclick="login()"
>
Iniciar sesión
</button>

<button onclick="registro()">
Registrarse
</button>

</div>

</header>


<div class="container">

<div class="menu">

<div onclick="inicio()">
🏠 Inicio
</div>

<div onclick="nuevoTraspaso()">
🚗 Iniciar traspaso
</div>

<div onclick="misExpedientes()">
📁 Mis expedientes
</div>

<div onclick="ajustes()">
⚙ Ajustes
</div>

</div>


<div
    class="content"
    id="contenido"
>
</div>

</div>


<div
    class="modal"
    id="modal"
>

<div
    class="modal-box"
    id="modalContenido"
>
</div>

</div>


<script>

let sesionActiva = false;

let usuarioActual = null;

let expedienteActual = null;


/* =============================
   SESIÓN
============================= */

function requiereSesion(){

    const token =
        localStorage.getItem(
            "gestorIA_token"
        );

    if(!sesionActiva || !token){

        login();

        return false;
    }

    return true;
}


/* =============================
   INICIO
============================= */

function inicio(){

    contenido.innerHTML=`

        <div class="card hero">

            <h1>
                Traspasa tu vehículo
                de forma sencilla.
            </h1>

            <p>
                Inicia el expediente y
                Gestor-IA te guiará durante
                todo el proceso.
            </p>

            <button onclick="nuevoTraspaso()">
                🚗 Iniciar traspaso
            </button>

        </div>

    `;
}


/* =============================
   LOGIN
============================= */

function login(){

    modalContenido.innerHTML=`

        <h2>
            Iniciar sesión
        </h2>

        <input
            id="loginEmail"
            placeholder="Correo"
        >

        <input
            id="loginPass"
            type="password"
            placeholder="Contraseña"
        >

        <br><br>

        <button onclick="entrar()">
            Entrar
        </button>

        <button
            class="btn-secundario"
            onclick="registro()"
        >
            Crear cuenta
        </button>

    `;

    modal.style.display="flex";
}


async function entrar(){

    const email =
        document
        .getElementById("loginEmail")
        .value;

    const password =
        document
        .getElementById("loginPass")
        .value;

    try{

        const res =
            await fetch(
                "/api/login",
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                        "application/json"
                    },

                    body:JSON.stringify({
                        email,
                        password
                    })

                }
            );

        const data =
            await res.json();

        if(!data.ok){

            alert(
                data.error ||
                "Login incorrecto."
            );

            return;
        }

        sesionActiva=true;

        usuarioActual =
            data.usuario || email;

        localStorage.setItem(
            "gestorIA_token",
            data.access_token
        );

        modal.style.display="none";

        actualizarUsuario();

        panel();

    }catch(e){

        alert(
            "No se pudo iniciar sesión."
        );

    }
}


/* =============================
   REGISTRO
============================= */

function registro(){

    modalContenido.innerHTML=`

        <h2>
            Crear cuenta
        </h2>

        <input
            id="regNombre"
            placeholder="Nombre"
        >

        <input
            id="regEmail"
            type="email"
            placeholder="Correo"
        >

        <input
            id="regPass"
            type="password"
            placeholder="Contraseña"
        >

        <br><br>

        <button onclick="crearCuenta()">
            Crear cuenta
        </button>

    `;

    modal.style.display="flex";
}


async function crearCuenta(){

    const nombre =
        document
        .getElementById("regNombre")
        .value;

    const email =
        document
        .getElementById("regEmail")
        .value;

    const password =
        document
        .getElementById("regPass")
        .value;

    const res =
        await fetch(
            "/api/registro",
            {

                method:"POST",

                headers:{
                    "Content-Type":
                    "application/json"
                },

                body:JSON.stringify({
                    nombre,
                    email,
                    password
                })

            }
        );

    const data =
        await res.json();

    if(data.ok){

        modalContenido.innerHTML=`

            <h2>
                ✉️ Revisa tu correo
            </h2>

            <p>
                Te hemos enviado un enlace
                para verificar tu cuenta.
            </p>

            <button onclick="login()">
                Iniciar sesión
            </button>

        `;

    }else{

        alert(
            data.error ||
            "No se pudo crear la cuenta."
        );

    }
}


/* =============================
   USUARIO
============================= */

function actualizarUsuario(){

    usuario.innerHTML=`

        <span>
            👤 ${usuarioActual}
        </span>

        <button
            class="btn-secundario"
            onclick="cerrarSesion()"
        >
            Salir
        </button>

    `;
}


function cerrarSesion(){

    localStorage.removeItem(
        "gestorIA_token"
    );

    sesionActiva=false;

    usuarioActual=null;

    expedienteActual=null;

    location.reload();
}


/* =============================
   PANEL
============================= */

function panel(){

    if(!requiereSesion()) return;

    contenido.innerHTML=`

        <div class="card">

            <h1>
                👋 Bienvenido
            </h1>

            <p>
                Inicia un traspaso o consulta
                tus expedientes.
            </p>

            <br>

            <button onclick="nuevoTraspaso()">
                🚗 Iniciar traspaso
            </button>

            <button
                class="btn-secundario"
                onclick="misExpedientes()"
            >
                📁 Mis expedientes
            </button>

        </div>

    `;
}


/* =============================
   NUEVO TRASPASO
============================= */

function nuevoTraspaso(){

    if(!requiereSesion()) return;

    contenido.innerHTML=`

        <div class="card">

            <h1>
                🚗 Iniciar traspaso
            </h1>

            <p>
                Introduce la matrícula.
            </p>

            <input
                id="matriculaTraspaso"
                placeholder="1234ABC"
            >

            <br><br>

            <button onclick="crearExpediente()">
                Continuar
            </button>

        </div>

    `;
}


async function crearExpediente(){

    const matricula =
        document
        .getElementById(
            "matriculaTraspaso"
        )
        .value
        .trim()
        .toUpperCase();

    if(!matricula){

        alert(
            "Introduce la matrícula."
        );

        return;
    }

    const token =
        localStorage.getItem(
            "gestorIA_token"
        );

    const res =
        await fetch(
            "/api/crear-expediente",
            {

                method:"POST",

                headers:{
                    "Content-Type":
                    "application/json",

                    "Authorization":
                    "Bearer " + token
                },

                body:JSON.stringify({
                    matricula
                })

            }
        );

    const data =
        await res.json();

    if(!data.ok){

        alert(
            data.error ||
            "No se pudo crear."
        );

        return;
    }

    expedienteActual =
        data.expediente;

    formularioParticipante();
}


/* =============================
   DATOS PARTICIPANTE
============================= */

function formularioParticipante(){

    contenido.innerHTML=`

        <div class="card">

            <h1>
                Tus datos
            </h1>

            <p>
                Vehículo:
                <b>
                    ${expedienteActual.matricula}
                </b>
            </p>

            <div class="formulario">

                <div class="campo">

                    <label>
                        Nombre y apellidos
                    </label>

                    <input
                        id="participanteNombre"
                        placeholder="Nombre completo"
                    >

                </div>


                <div class="campo">

                    <label>
                        DNI / NIE
                    </label>

                    <input
                        id="participanteDni"
                        placeholder="DNI o NIE"
                    >

                </div>


                <div class="campo">

                    <label>
                        Teléfono
                    </label>

                    <input
                        id="participanteTelefono"
                        placeholder="Teléfono"
                    >

                </div>


                <div class="campo">

                    <label>
                        Correo
                    </label>

                    <input
                        id="participanteEmail"
                        type="email"
                        placeholder="Correo electrónico"
                    >

                </div>


                <div class="campo">

                    <label>
                        En este traspaso eres:
                    </label>

                    <select id="participanteRol">

                        <option value="">
                            Selecciona
                        </option>

                        <option value="COMPRADOR">
                            Comprador
                        </option>

                        <option value="VENDEDOR">
                            Vendedor
                        </option>

                    </select>

                </div>

            </div>

            <br>

            <button onclick="guardarParticipante()">
                Continuar
            </button>

        </div>

    `;
}


async function guardarParticipante(){

    const nombre =
        document
        .getElementById(
            "participanteNombre"
        )
        .value
        .trim();

    const dni_nie =
        document
        .getElementById(
            "participanteDni"
        )
        .value
        .trim();

    const telefono =
        document
        .getElementById(
            "participanteTelefono"
        )
        .value
        .trim();

    const email =
        document
        .getElementById(
            "participanteEmail"
        )
        .value
        .trim();

    const rol =
        document
        .getElementById(
            "participanteRol"
        )
        .value;

    if(
        !nombre ||
        !dni_nie ||
        !telefono ||
        !email ||
        !rol
    ){

        alert(
            "Completa todos los campos."
        );

        return;
    }

    const token =
        localStorage.getItem(
            "gestorIA_token"
        );

    const res =
        await fetch(
            "/api/guardar-participante",
            {

                method:"POST",

                headers:{

                    "Content-Type":
                    "application/json",

                    "Authorization":
                    "Bearer " + token

                },

                body:JSON.stringify({

                    expediente_id:
                        expedienteActual.id,

                    nombre,
                    dni_nie,
                    telefono,
                    email,
                    rol

                })

            }
        );

    const data =
        await res.json();

    if(!data.ok){

        alert(
            data.error ||
            "No se pudieron guardar los datos."
        );

        return;
    }

    abrirChat();
}


/* =============================
   CHAT DEL EXPEDIENTE
============================= */

function abrirChat(){

    contenido.innerHTML=`

        <div class="card">

            <h1>
                🚗 ${expedienteActual.matricula}
            </h1>

            <div class="estado">

                🤖 Gestor-IA está gestionando
                este expediente.

            </div>

            <div id="chat"></div>

            <div class="fila-chat">

                <input
                    id="mensaje"
                    placeholder="Escribe tu respuesta..."
                >

                <button
                    onclick="enviarMensaje()"
                >
                    Enviar
                </button>

            </div>

        </div>

    `;

    document
        .getElementById("mensaje")
        .addEventListener(
            "keydown",
            function(e){

                if(e.key==="Enter"){

                    enviarMensaje();

                }

            }
        );

    agregarMensaje(
        "bot",
        "Perfecto. Ya tengo tus datos iniciales. Vamos a continuar con el traspaso."
    );
}


/* =============================
   MENSAJES
============================= */

function agregarMensaje(
    tipo,
    texto
){

    const chat =
        document.getElementById(
            "chat"
        );

    if(!chat) return;

    const div =
        document.createElement(
            "div"
        );

    div.className=tipo;

    const span =
        document.createElement(
            "span"
        );

    span.textContent=texto;

    div.appendChild(span);

    chat.appendChild(div);

    chat.scrollTop =
        chat.scrollHeight;
}


async function enviarMensaje(){

    const input =
        document.getElementById(
            "mensaje"
        );

    const mensaje =
        input.value.trim();

    if(!mensaje) return;

    agregarMensaje(
        "user",
        mensaje
    );

    input.value="";

    agregarMensaje(
        "bot",
        "Pensando..."
    );

    const token =
        localStorage.getItem(
            "gestorIA_token"
        );

    try{

        const res =
            await fetch(
                "/api/chat",
                {

                    method:"POST",

                    headers:{

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " + token

                    },

                    body:JSON.stringify({

                        expediente_id:
                            expedienteActual.id,

                        mensaje

                    })

                }
            );

        const data =
            await res.json();

        const chat =
            document.getElementById(
                "chat"
            );

        if(chat?.lastChild){

            chat.removeChild(
                chat.lastChild
            );

        }

        if(!res.ok){

            agregarMensaje(
                "bot",
                data.error ||
                "No se pudo responder."
            );

            return;
        }

        agregarMensaje(
            "bot",
            data.respuesta
        );

    }catch(e){

        agregarMensaje(
            "bot",
            "Error de conexión."
        );

    }
}


/* =============================
   EXPEDIENTES
============================= */

function misExpedientes(){

    if(!requiereSesion()) return;

    contenido.innerHTML=`

        <div class="card">

            <h1>
                📁 Mis expedientes
            </h1>

            <p>
                En el siguiente paso haremos que
                aparezcan aquí todos tus traspasos
                y puedas continuar el mismo chat.
            </p>

        </div>

    `;
}


/* =============================
   AJUSTES
============================= */

function ajustes(){

    if(!requiereSesion()) return;

    contenido.innerHTML=`

        <div class="card">

            <h1>
                ⚙ Ajustes
            </h1>

        </div>

    `;
}


modal.onclick=function(e){

    if(e.target===modal){

        modal.style.display="none";

    }
};


inicio();

</script>

</body>

</html>
